name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # the version CI tests with: on the newest stable three widget tests fail
          # on a pending timer, so the site was not deployed
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      # --no-web-resources-cdn: CanvasKit is served with the app, not fetched
      # from a CDN, so the page asks no other site for anything it draws with
      - run: flutter build web --release --no-web-resources-cdn --base-href "/${{ github.event.repository.name }}/" --dart-define=DAILY_SALT=${{ secrets.DAILY_SALT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
