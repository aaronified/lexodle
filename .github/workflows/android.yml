name: Android build

# Builds a debug APK on every push that touches the app, so a mistake in the
# Android side (the Kotlin in MainActivity, the manifest, Gradle) is found now and
# not when a release is cut. Nothing is published.

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug --dart-define=DAILY_SALT=${{ secrets.DAILY_SALT }}
