<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A minimal word game in 17 Latin-script languages.">
  <meta name="theme-color" content="#141409">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="lexodle">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>lexodle</title>
  <link rel="manifest" href="manifest.json">

  <!-- No white flash, and the logo while the app starts -->
  <style>
    html, body { margin: 0; height: 100%; background: #141409; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #141409; color: #E6E3D1;
      font: 700 22px/1 "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
      letter-spacing: .5px;
    }
    #splash svg { width: 84px; height: 54px; }
  </style>
</head>
<body>
  <div id="splash" aria-label="lexodle">
    <svg viewBox="9 23 78 50" role="img" aria-hidden="true">
      <rect x="9" y="51" width="22" height="22" rx="4" fill="#535245"/>
      <rect x="37" y="37" width="22" height="22" rx="4" fill="#C7CB82"/>
      <rect x="65" y="23" width="22" height="22" rx="4" fill="#B4CEA5"/>
    </svg>
    <span>lexodle</span>
  </div>
  <script>
    // Flutter announces its first frame; the splash has done its job by then.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.remove(); }
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
