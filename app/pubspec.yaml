name: lexodle
description: "Lexodle: a minimal word game in many Latin-script languages."
publish_to: 'none'
version: 0.9.0+1

environment:
  sdk: ^3.13.5

dependencies:
  audioplayers: ^6.8.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.2
  flutter_svg: ^2.3.0
  flutter_timezone: ^5.1.1
  html: ^0.15.7
  http: ^1.6.0
  image_picker: ^1.2.4
  ota_update: ^7.1.0
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/words/
    - assets/equations/
    - assets/geography/
    - assets/icons/
    - assets/sounds/
    - assets/flags/
    - assets/donate/
    - assets/fonts/OFL.txt
    - assets/changelog.txt
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
