<title>Lexodle Home</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* The app's look: JetBrains Mono, lowercase, hairline borders, flat surfaces, a pink accent on olive-black (dark) or cream (light). Dark values are sampled from the app's screenshots; light ones are close estimates. */
:root {
  --bg: #fefbe8; --fg: #1d1d11; --dim: #6c6b5e; --outline: #7c7a62; --outlinev: #cac8ae;
  --primary: #8c4b84; --onprimary: #ffffff; --secondary: #4a6b3f; --yellow: #d9a800; --flame: #8a8d2a; --absent: #e5e3cf; --bar: #b5b39d; --hl: #efecd6;
  --skill: #1f5fd0; --luck: #9a7400; --risk: #2e7d32; --bits: #7a4fd0; --bronze: #a45f1d; --silver: #6f7782; --gold: #a57c00; --platinum: #2f8a99;
  --font: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141409; --fg: #e6e3d1; --dim: #9e9c8d; --outline: #949279; --outlinev: #494833;
  --primary: #f6b0ea; --onprimary: #4f1c4c; --secondary: #b4cea5; --yellow: #f0c219; --flame: #c7cb82; --absent: #313125; --bar: #535245; --hl: #26201b;
  --skill: #4c8dff; --luck: #f2c230; --risk: #5cb85c; --bits: #a98bff; --bronze: #d28a4d; --silver: #c4c8cf; --gold: #f0c219; --platinum: #7fdcd8; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141409; --fg: #e6e3d1; --dim: #9e9c8d; --outline: #949279; --outlinev: #494833;
  --primary: #f6b0ea; --onprimary: #4f1c4c; --secondary: #b4cea5; --yellow: #f0c219; --flame: #c7cb82; --absent: #313125; --bar: #535245; --hl: #26201b;
  --skill: #4c8dff; --luck: #f2c230; --risk: #5cb85c; --bits: #a98bff; --bronze: #d28a4d; --silver: #c4c8cf; --gold: #f0c219; --platinum: #7fdcd8; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.45; text-transform: lowercase;
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
.app { max-width: 480px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; }
.scroll { flex: 1; overflow-y: auto; padding: 40px 24px 24px; display: flex; flex-direction: column; }
.head { display: flex; align-items: center; gap: 16px; }
.logo { display: block; width: 56px; height: 44px; flex: none; }
.title { flex: 1; font-size: 36px; font-weight: 700; line-height: 1.1; }
.icon { width: 1em; height: 1em; fill: currentColor; display: block; }
.iconbtn { width: 48px; height: 48px; display: grid; place-items: center; background: transparent; border: 0; color: var(--fg); cursor: pointer; font-size: 28px; }
.caption { font-size: 12px; letter-spacing: 2px; color: var(--dim); }
.lang { margin-top: 28px; height: 56px; border: 1px solid var(--outline); border-radius: 4px; display: flex; align-items: center; gap: 12px; padding: 0 12px; background: transparent; color: var(--fg); font: inherit; font-size: 16px; text-align: left; cursor: pointer; width: 100%; }
.lang span.n { flex: 1; letter-spacing: 1px; }
.flag { width: 24px; height: 16px; flex: none; }
.streak { margin-top: 20px; border: 1px solid var(--outlinev); border-radius: 3px; padding: 12px 12px 8px; }
.srow { display: flex; align-items: center; gap: 6px; }
.srow .num { font-size: 28px; font-weight: 700; }
.srow .cap { flex: 1; margin-left: 4px; }
.srow .best { font-size: 11px; color: var(--dim); display: flex; align-items: center; gap: 8px; }
.week { display: flex; margin-top: 8px; }
.day { flex: 1; margin: 0 1px; padding: 6px 0; border: 1px solid transparent; border-radius: 3px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--dim); }
.day.today { border-color: color-mix(in srgb, var(--fg) 50%, transparent); }
.flames { display: flex; height: 22px; align-items: center; color: var(--outlinev); }
.flames.on { color: var(--flame); }
.flames .icon { font-size: 22px; } .flames.two .icon { font-size: 18px; } .flames.two .icon + .icon { margin-left: -4px; }
hr { border: 0; border-top: 1px solid var(--outlinev); margin: 28px 0 12px; }
.menu { width: 100%; height: 52px; margin-bottom: 8px; border: 1px solid var(--outline); border-radius: 3px; background: transparent; color: var(--primary); font: inherit; letter-spacing: 1.2px; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; }
.menu .glyphs { display: flex; gap: 6px; font-size: 22px; margin-left: auto; }
.menu.with { position: relative; } .menu.with .glyphs { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); margin: 0; }
.srow2 { display: flex; gap: 8px; }
.sq { width: 52px; height: 52px; flex: none; border: 1px solid var(--outline); border-radius: 3px; background: transparent; color: var(--primary); display: grid; place-items: center; font-size: 28px; cursor: pointer; }
.pinned { padding: 8px 24px 16px; display: flex; flex-direction: column; gap: 6px; }
.freq { display: flex; align-items: center; padding-left: 4px; gap: 8px; font-size: 13px; color: var(--dim); cursor: pointer; border: 0; background: transparent; font-family: inherit; text-align: left; }
.freq span { flex: 1; }
.sw { width: 40px; height: 22px; border-radius: 11px; border: 2px solid var(--outline); position: relative; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--outline); }
.sw.on { background: var(--primary); border-color: var(--primary); } .sw.on::after { left: 20px; background: var(--onprimary); }
.playarea { display: flex; flex-direction: column; gap: 8px; touch-action: pan-y; user-select: none; }
.mode { display: block; width: 100%; position: relative; height: 52px; border: 1px solid var(--outline); border-radius: 3px; background: transparent; color: var(--fg); font: inherit; letter-spacing: 1.2px; cursor: pointer; overflow: hidden; padding: 0; }
.mode .slide { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 0 36px; }
.mode .slide .icon { font-size: 24px; color: var(--primary); }
.mode .nm { text-align: left; line-height: 1.1; }
.mode .nm small { display: block; font-size: 11px; color: var(--dim); letter-spacing: 0; margin-top: 2px; }
.modebar { position: relative; }
.chev { position: absolute; top: 1px; bottom: 1px; width: 44px; border: 0; background: transparent; color: var(--dim); font: inherit; font-size: 22px; cursor: pointer; z-index: 2; }
.chev.l { left: 1px; } .chev.r { right: 1px; }
.chev:hover { color: var(--primary); }
.row { display: flex; gap: 8px; }
.btn { flex: 1; height: 52px; border-radius: 3px; font: inherit; letter-spacing: 1.5px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; }
.btn.fill { background: var(--primary); color: var(--onprimary); border: 1px solid var(--primary); font-weight: 700; font-size: 15px; }
.btn.line { background: transparent; color: var(--primary); border: 1px solid var(--outline); letter-spacing: 1.2px; }
.btn small { font-size: 11px; letter-spacing: 0; color: var(--primary); opacity: .9; }
.dots { display: flex; justify-content: center; gap: 6px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--outlinev); }
.dots i.on { background: var(--primary); }
.toast { position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 3px; font-size: 13px; z-index: 50; max-width: calc(100% - 32px); }
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.55); display: flex; justify-content: center; align-items: center; padding: 24px 16px; overscroll-behavior: contain; }
.modal { background: var(--bg); color: var(--fg); border: 1px solid var(--outline); border-radius: 3px; max-width: 440px; width: 100%; max-height: 100%; overflow: auto; display: flex; flex-direction: column; overscroll-behavior: contain; }
.step { height: 64px; border: 1px solid var(--outline); border-radius: 3px; display: flex; align-items: center; overflow: hidden; }
.step button.ch { width: 48px; height: 48px; flex: none; border: 0; background: transparent; color: var(--fg); font-size: 22px; cursor: pointer; }
.step button.ch:disabled { color: var(--outlinev); cursor: default; }
.step .view { flex: 1; height: 64px; position: relative; overflow: hidden; touch-action: pan-y; }
.step .item { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 4px; }
.step .item b { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.step .item span { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.sdots { display: flex; justify-content: center; margin-top: 8px; }
.sdots i { width: 6px; height: 6px; border-radius: 50%; margin: 0 3px; background: var(--outlinev); }
.sdots i.on { background: var(--primary); }
.note11 { font-size: 11px; color: var(--dim); }
.share { display: flex; align-items: center; }
.share .cap { flex: 1; }
input[type=range] { width: 100%; accent-color: var(--primary); }
input[type=range]:disabled { opacity: .38; }
.mx { display: grid; grid-template-columns: 84px repeat(4, 1fr); align-items: center; }
.mx .h { text-align: center; font-size: 12px; font-weight: 700; line-height: 1.2; }
.mx .h small { display: block; font-weight: 400; font-size: 10px; letter-spacing: .8px; color: var(--dim); }
.mx .r { font-size: 12px; font-weight: 700; padding-right: 8px; }
.cell { margin: 2px; height: 46px; border-radius: 3px; border: 1px solid; background: transparent; cursor: pointer; padding: 0; font: inherit; }
.chk { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; background: transparent; border: 0; color: var(--fg); font: inherit; text-align: left; padding: 0; }
.chk i { width: 18px; height: 18px; border: 2px solid var(--outline); border-radius: 2px; flex: none; margin-top: 2px; display: grid; place-items: center; font-style: normal; font-size: 13px; line-height: 1; }
.chk i.on { background: var(--primary); border-color: var(--primary); color: var(--onprimary); }
.capr { font-size: 12px; letter-spacing: 2px; color: var(--dim); }
.fbtn { flex: 1; height: 52px; border-radius: 3px; font: inherit; letter-spacing: 1.2px; cursor: pointer; }
.fbtn.fill { background: var(--primary); color: var(--onprimary); border: 1px solid var(--primary); font-weight: 700; font-size: 15px; }
.fbtn.line { background: transparent; color: var(--primary); border: 1px solid var(--outline); }
.modal > * { flex-shrink: 0; }
.mhead { display: flex; align-items: center; padding: 8px 8px 0 24px; }
.mhead b { flex: 1; font-size: 18px; }
.mbody { padding: 4px 24px 24px; display: flex; flex-direction: column; gap: 12px; }
.opt { display: flex; flex-direction: column; gap: 3px; padding: 10px 12px; border: 1px solid var(--outlinev); border-radius: 3px; background: transparent; color: var(--fg); font: inherit; text-align: left; cursor: pointer; }
.opt[aria-checked="true"] { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 15%, transparent); }
.opt b { font-size: 15px; letter-spacing: 1px; }
.small { font-size: 12px; } .dimt { color: var(--dim); }
.hd { display: flex; align-items: center; gap: 8px; }
.dot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--dim); background: transparent; color: var(--dim); font: italic 700 11px/1 Georgia, serif; text-transform: none; cursor: pointer; display: grid; place-items: center; padding: 0; flex: none; }
.pop { position: fixed; z-index: 60; max-width: min(320px, calc(100vw - 32px)); background: var(--bg); color: var(--fg); border: 1px solid var(--outline); border-radius: 3px; padding: 10px 12px; font-size: 13px; line-height: 1.45; }
button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.page { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; }
.page .in { max-width: 480px; margin: 0 auto; padding: 0 0 32px; }
.bar { display: flex; align-items: center; gap: 12px; padding: 8px 12px; font-size: 22px; font-weight: 700; }
.pbody { padding: 8px 24px 0; }
.chips { display: flex; gap: 8px; }
.chip { height: 36px; padding: 0 12px; border: 1px solid var(--outlinev); border-radius: 3px; background: transparent; color: var(--fg); font: inherit; display: flex; align-items: center; gap: 8px; cursor: pointer; }
.chip.on { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 15%, transparent); }
.stats { display: flex; margin-top: 16px; }
.stats div { flex: 1; } .stats b { display: block; font-size: 28px; line-height: 1.1; } .stats span { font-size: 12px; letter-spacing: 2px; color: var(--dim); }
.medals { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 4px; }
.mp { height: 32px; padding: 0 12px; border-radius: 999px; border: 1.5px solid currentColor; background: transparent; font: inherit; font-size: 12px; letter-spacing: 1px; cursor: pointer; }
.mp.on { background: color-mix(in srgb, currentColor 18%, transparent); }
.arow { border-top: 1px solid var(--outlinev); padding: 14px 0; }
.ahead { display: flex; align-items: center; gap: 16px; }
.aicon { font-size: 44px; flex: none; display: block; width: 44px; height: 44px; }
.aicon .icon { width: 44px; height: 44px; }
.atext { flex: 1; min-width: 0; }
.atext b { font-weight: 700; }
.atext .tag { font-size: 10px; letter-spacing: 1.5px; margin-left: 8px; }
.atext .d { font-size: 12px; }
.aright { text-align: right; font-size: 11px; color: var(--dim); }
.aright b { display: block; font-size: 14px; color: var(--primary); }
.bar2 { margin: 10px 0 0 60px; display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--dim); }
.bar2 i { flex: 1; height: 6px; border-radius: 3px; background: var(--outlinev); overflow: hidden; display: block; }
.bar2 i b { display: block; height: 100%; }
.modetag { display: inline-flex; width: 14px; height: 14px; vertical-align: -2px; margin-left: 6px; color: var(--dim); }
</style>

<div class="app">
  <div class="scroll" id="scroll">
    <div class="head">
      <svg class="logo" viewBox="0 0 96 76" aria-hidden="true"><rect x="0" y="40" width="30" height="30" rx="5" fill="var(--bar)"/><rect x="26" y="22" width="30" height="30" rx="5" fill="var(--yellow)"/><rect x="52" y="4" width="30" height="30" rx="5" fill="var(--secondary)"/></svg>
      <span class="title">lexodle</span>
      <button class="iconbtn" type="button" aria-label="settings" id="settings">ICON_settings</button>

    <div class="caption" style="margin-top:6px">a word game, in many tongues</div>
    <button class="lang" type="button" id="lang"><svg class="flag" viewBox="0 0 24 16" aria-hidden="true"><rect width="24" height="16" fill="#f4f4f4"/><g fill="#b22234"><rect y="0" width="24" height="1.6"/><rect y="3.2" width="24" height="1.6"/><rect y="6.4" width="24" height="1.6"/><rect y="9.6" width="24" height="1.6"/><rect y="12.8" width="24" height="1.6"/></g><rect width="10" height="8.8" fill="#3c3b6e"/></svg><span class="n">english (us)</span><span style="color:var(--dim)">&#9662;</span></button>

    <hr>
    <button class="menu with" type="button" id="ach"><span class="t">achievements  ACHN</span><span class="glyphs" style="color:var(--primary)">ICON_award ICON_crown ICON_trophy</span></button>
    <div class="srow2"><button class="sq" type="button" id="stylebtn" aria-label="playstyle: analyst">ICON_microscope</button><button class="menu" type="button" style="margin:0;flex:1" id="history">history</button></div>
    <button class="menu" type="button" style="margin-top:8px" id="how">how to play</button>

  <div class="pinned">

    <div class="playarea" id="play">
      <div class="modebar"><button class="mode" type="button" id="mode" aria-label="game modes"><div class="slide" id="slide"></div></button><button class="chev l" type="button" id="prev" aria-label="previous mode">&#8249;</button><button class="chev r" type="button" id="next" aria-label="next mode">&#8250;</button></div>
      <div class="dots" id="dots" aria-hidden="true"></div>
      <div class="row"><button class="btn fill" type="button" id="playbtn">play</button><button class="btn line" type="button" id="dailybtn"></button></div>
    </div>
  </div>
</div>
<div id="layer"></div>
<div class="page" id="page" style="display:none"></div>
