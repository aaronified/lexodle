<title>Lexodle Game Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one 480px column like the app. Summary table picks a level; the level card shows the sums; the last card turns the three means into expected tries. */
:root {
  --bg: #f6f6f3; --surface: #ffffff; --fg: #1b1c1a; --dim: #5d605b; --line: #dcdcd6; --line2: #b9bab3;
  --skill: #1f5fd0; --luck: #9a7400; --daring: #2e7d32;
  --green: #4f8a4a; --yellow: #c79a12; --grey: #d3d4cf; --tilefg: #ffffff; --greyfg: #55574f;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121311; --surface: #1b1c1a; --fg: #ecece8; --dim: #a3a59e; --line: #2f302d; --line2: #4a4b47;
  --skill: #4c8dff; --luck: #f2c230; --daring: #5cb85c;
  --green: #5a9a55; --yellow: #d6ab22; --grey: #33342f; --tilefg: #101110; --greyfg: #a3a59e; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121311; --surface: #1b1c1a; --fg: #ecece8; --dim: #a3a59e; --line: #2f302d; --line2: #4a4b47;
  --skill: #4c8dff; --luck: #f2c230; --daring: #5cb85c;
  --green: #5a9a55; --yellow: #d6ab22; --grey: #33342f; --tilefg: #101110; --greyfg: #a3a59e; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.5;
  padding-block: 16px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
h1 { font-size: 13px; letter-spacing: .12em; font-weight: 500; margin: 0; }
h2 { font-size: 20px; margin: 0; text-wrap: balance; }
h3 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin: 0; font-weight: 600; }
p { margin: 0; }
.dim { color: var(--dim); } .small { font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.skill { color: var(--skill); } .luck { color: var(--luck); } .daring { color: var(--daring); }
.note { border: 1px dashed var(--line2); border-radius: 4px; padding: 8px 10px; color: var(--dim); font-size: 12px; }
section { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.tiles { display: inline-flex; gap: 3px; }
.tile { width: 22px; height: 22px; border-radius: 3px; display: grid; place-items: center; font-weight: 700; font-size: 12px; text-transform: uppercase; }
.tile.g { background: var(--green); color: var(--tilefg); } .tile.y { background: var(--yellow); color: var(--tilefg); } .tile.x { background: var(--grey); color: var(--greyfg); }
.wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th { text-align: right; font-size: 11px; font-weight: 600; color: var(--dim); padding: 4px 6px; border-bottom: 1px solid var(--line); }
td { text-align: right; padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
tbody tr.pick { cursor: pointer; }
tbody tr.sel td { background: color-mix(in srgb, var(--fg) 7%, transparent); }
tbody tr.pick:focus-visible, .tabs button:focus-visible { outline: 2px solid var(--skill); outline-offset: -2px; }
tfoot td { font-weight: 700; border-bottom: 0; }
.tabs { display: flex; gap: 6px; }
.tabs button { flex: 1; font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line2); border-radius: 4px; padding: 8px 0; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.block { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 12px; }
.sum { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font-variant-numeric: tabular-nums; }
.sum > span:nth-of-type(even) { text-align: right; }
.sum .res { font-weight: 700; }
.sum .rule { grid-column: 1 / -1; border-top: 1px solid var(--line); margin: 3px 0; }
.big { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
svg { display: block; width: 100%; height: auto; }
svg text { fill: var(--dim); font-family: var(--font); font-size: 10px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.cols > div { min-width: 0; }
.pk { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.pk b { font-size: 15px; letter-spacing: .02em; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11px; color: var(--dim); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.steps { display: flex; flex-direction: column; gap: 14px; }
.step { display: grid; grid-template-columns: 22px 1fr; gap: 10px; }
.step > span { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line2); display: grid; place-items: center; font-size: 11px; color: var(--dim); }
.step > div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
td .tile { width: 18px; height: 18px; font-size: 10px; }
td .tiles { gap: 2px; }
td, th { padding-inline: 4px; }
@media (max-width: 380px) { .cols { grid-template-columns: 1fr; } }
</style>

<main>
  <header style="display:flex;flex-direction:column;gap:10px">
    <h1>REVIEW</h1>
    <h2 id="head"></h2>
    <p class="note">Mockup. Words and pool sizes are invented. All other figures come from the formulas.</p>
  </header>

  <section>
    <h3>Your game</h3>
    <div class="wrap"><table>
      <thead><tr><th>guess</th><th>words</th><th class="skill">skill</th><th class="daring">daring</th><th class="luck">luck</th></tr></thead>
      <tbody id="rows"></tbody>
      <tfoot id="means"></tfoot>
    </table></div>
    <p class="dim small">Tap a row for its calculation.</p>
  </section>

  <section>
    <h3>Each level</h3>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="card" id="level"></div>
  </section>

  <section>
    <h3>Information gained</h3>
    <div class="card" id="tries"></div>
  </section>
</main>

<script>
const ANSWER = 'PRISM';
// pool sizes of every outcome of each guess; the pool you landed in is the next level's word count.
// hstar: expected gain of the best guess; dstar: daring value of the most daring guess (both need every accepted word).
const G = [
  { word: 'STARE', n: 3000, sizes: [184,195,182,169,157,146,136,126,118,109,102,95,88,82,76,71,66,61,57,53,49,46,43,40,37,34,32,30,28,26,24,22,21,19,18,17,15,14,13,12,12,11,10,9,9,8,7,7,6,6,6,5,5,4,4,4,4,3,3,3,3,3,2,2,2,2,2,2,2].concat(Array(41).fill(1)), landedSize: 46, hstar: 6.1, bestWord: 'TRACE', dstar: 60, dareWord: 'FUZZY',
    top: [['TRACE',100],['CRATE',99],['SLATE',98]], bottom: [['MUMMY',7],['FUZZY',4],['JAZZY',1]],
    dare: [['FUZZY',60,4],['MUMMY',57,7],['JUMBO',52,12]], lucky: [['PRISM',99],['PRIMO',97],['PRISE',96]] },
  { word: 'BRISK', n: 46, sizes: [11,9,8,6,4,3,2,1,1,1], landedSize: 9, hstar: 3.4, bestWord: 'CHOIR', dstar: 70, dareWord: 'FUZZY',
    top: [['CHOIR',100],['SPLIT',98],['CLOMP',95]], bottom: [['FUZZY',11],['MAMMA',6],['XYLYL',0]],
    dare: [['FUZZY',70,11],['MAMMA',66,6],['XYLYL',62,0]], lucky: [['PRISM',96],['PRISE',91],['PRIMP',87]] },
  { word: 'CRISP', n: 9, sizes: [4,2,1,1,1], landedSize: 2, hstar: 2.6, bestWord: 'FRISK', dstar: 56, dareWord: 'MUMMY',
    top: [['FRISK',100],['PRISM',97],['GRIST',92]], bottom: [['MUMMY',0],['QUEEN',3],['AUDIO',9]],
    dare: [['MUMMY',56,0],['QUEEN',44,3],['AUDIO',33,9]], lucky: [['PRISM',78],['FRISK',56],['GRIST',44]] },
  { word: 'PRISM', n: 2, sizes: [1,1], landedSize: 1, hstar: 1, bestWord: 'PRISM', ties: true, dstar: 0, dareWord: '',
    top: [['PRISM',100],['FRISK',100],['PRISE',100]], bottom: [['MUMMY',0],['FUZZY',0],['JAZZY',0]],
    dare: [['MUMMY',0,0],['FUZZY',0,0],['JAZZY',0,0]], lucky: [['PRISM',0],['FRISK',0],['PRISE',0]] },
];

// ---- the maths: everything is information, in bits ----
const log2 = Math.log2;
G.forEach(g => {
  g.sizes.sort((a, b) => b - a);
  g.landed = g.sizes.indexOf(g.landedSize);
  // gain of each outcome: bits removed if the answer is in that group
  g.gains = g.sizes.map(s => log2(g.n / s));
  g.H = g.sizes.reduce((a, s, i) => a + s / g.n * g.gains[i], 0);          // expected gain
  g.skill = Math.min(100, g.H / g.hstar * 100);
  const share = test => g.sizes.reduce((a, s, i) => a + (test(g.gains[i]) ? s : 0), 0) / g.n * 100;
  g.more = share(x => x > g.H + 1e-9);                                      // chance of gaining more than expected
  g.less = share(x => x < g.H - 1e-9);
  g.D = g.less - g.more;
  g.daring = g.dstar > 0 ? Math.min(100, Math.max(0, g.D) / g.dstar * 100) : 0;
  g.gain = g.gains[g.landed];                                                // what you gained
  g.bLuck = g.gain - g.H;                                                    // luck in bits
  g.gotMore = share(x => x > g.gain + 1e-9);
  g.gotLess = share(x => x < g.gain - 1e-9);
  g.luck = g.gotLess - g.gotMore;                                            // luck score
});
const mean = k => G.reduce((a, g) => a + g[k], 0) / G.length;
const M = { skill: mean('skill'), daring: mean('daring'), luck: mean('luck') };
const needed = log2(G[0].n);

// ---- helpers ----
const $ = id => document.getElementById(id);
const f0 = v => Math.round(v).toString();
const f1 = v => v.toFixed(1);
const f2 = v => v.toFixed(2);
const sg = (v, d = 1) => (Math.abs(v) < Math.pow(10, -d) / 2 ? '' : v < 0 ? '−' : '+') + Math.abs(v).toFixed(d);
const pc = v => (Math.round(v) === 0 ? '0%' : (v > 0 ? '+' : '−') + Math.abs(Math.round(v)) + '%');
const N = v => v.toLocaleString('en-US');
function tiles(guess) {
  const marks = Array(5).fill('x'), left = {};
  [...ANSWER].forEach((c, i) => { if (guess[i] === c) marks[i] = 'g'; else left[c] = (left[c] || 0) + 1; });
  [...guess].forEach((c, i) => { if (marks[i] !== 'g' && left[c]) { marks[i] = 'y'; left[c]--; } });
  return '<span class="tiles" aria-label="' + guess + '">' + [...guess].map((c, i) => '<span class="tile ' + marks[i] + '">' + c + '</span>').join('') + '</span>';
}
$('head').textContent = 'The word was ' + ANSWER + '. You solved it in ' + G.length + ' guesses.';

// ---- summary ----
let sel = 1;
function renderRows() {
  $('rows').innerHTML = G.map((g, i) => '<tr class="pick' + (i === sel ? ' sel' : '') + '" tabindex="0" data-i="' + i + '"><td>' + (i + 1) + ' ' + tiles(g.word) + '</td><td>' + N(g.n) + '</td><td class="skill">' + f0(g.skill) + '</td><td class="daring">' + f0(g.daring) + '</td><td class="luck">' + pc(g.luck) + '</td></tr>').join('');
  $('rows').querySelectorAll('tr').forEach(tr => {
    const go = () => { sel = +tr.dataset.i; renderAll(); };
    tr.addEventListener('click', go);
    tr.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });
  $('means').innerHTML = '<tr><td>average</td><td></td><td class="skill">' + f1(M.skill) + '</td><td class="daring">' + f1(M.daring) + '</td><td class="luck">' + sg(M.luck) + '%</td></tr>';
}
function renderTabs() {
  $('tabs').innerHTML = G.map((g, i) => '<button role="tab" type="button" aria-selected="' + (i === sel) + '" data-i="' + i + '">guess ' + (i + 1) + '</button>').join('');
  $('tabs').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { sel = +b.dataset.i; renderAll(); }));
}

// ---- plot: one column per outcome, as wide as its chance and as tall as the bits it gains ----
function plot(g) {
  const W_ = 420, H = 186, L = 30, R = 8, T = 10, B = 42, pw = W_ - L - R, ph = H - T - B, max = g.gains[g.gains.length - 1] * 1.08 || 1;
  const y = v => T + ph - v / max * ph;
  let x = L, bars = '', mark = '';
  g.sizes.forEach((s, i) => {
    const w = s / g.n * pw, v = g.gains[i];
    const more = v > g.H + 1e-9, less = v < g.H - 1e-9;
    const fill = more ? 'var(--daring)' : (less ? 'var(--line2)' : 'var(--dim)');
    bars += '<rect x="' + x.toFixed(2) + '" y="' + y(v).toFixed(2) + '" width="' + Math.max(w - .4, .3).toFixed(2) + '" height="' + (T + ph - y(v)).toFixed(2) + '" fill="' + fill + '" opacity="' + (more ? .6 : 1) + '"/>';
    if (i === g.landed) {
      const cx = x + w / 2;
      bars += '<rect x="' + x.toFixed(2) + '" y="' + y(v).toFixed(2) + '" width="' + Math.max(w - .4, 1.5).toFixed(2) + '" height="' + Math.max(T + ph - y(v), 1.5).toFixed(2) + '" fill="none" stroke="var(--fg)" stroke-width="2"/>';
      mark = '<path d="M' + (cx - 5) + ' ' + (T + ph + 12) + ' L' + (cx + 5) + ' ' + (T + ph + 12) + ' L' + cx + ' ' + (T + ph + 4) + ' Z" fill="var(--fg)"/><text x="' + Math.min(Math.max(cx, L + 14), W_ - R - 14) + '" y="' + (T + ph + 24) + '" text-anchor="middle" style="fill:var(--fg)">you</text>';
    }
    x += w;
  });
  const yH = y(g.H), yS = y(g.hstar), close = Math.abs(yH - yS) < 22, mid = L + pw / 2;
  const lines =
    '<line x1="' + L + '" x2="' + (W_ - R) + '" y1="' + yH + '" y2="' + yH + '" stroke="var(--skill)" stroke-width="1.5" stroke-dasharray="5 3"/>' +
    '<line x1="' + L + '" x2="' + (W_ - R) + '" y1="' + yS + '" y2="' + yS + '" stroke="var(--skill)" stroke-width="1.5" stroke-dasharray="1.5 2.5"/>' +
    '<line x1="' + mid + '" x2="' + mid + '" y1="' + T + '" y2="' + (T + ph) + '" stroke="var(--luck)" stroke-width="1.5"/>';
  const lab = (close
      ? '<text x="' + (W_ - R) + '" y="' + (Math.min(yH, yS) - 4) + '" text-anchor="end" style="fill:var(--skill)">H ' + f2(g.H) + ' (dashed) · H* ' + f2(g.hstar) + ' (dotted)</text>'
      : '<text x="' + (W_ - R) + '" y="' + (yH + 11) + '" text-anchor="end" style="fill:var(--skill)">H ' + f2(g.H) + '</text><text x="' + (W_ - R) + '" y="' + (yS - 4) + '" text-anchor="end" style="fill:var(--skill)">H* ' + f2(g.hstar) + '</text>') +
    '<text x="' + (mid - 4) + '" y="' + (T + 8) + '" text-anchor="end" style="fill:var(--luck)">luck 0</text>';
  const axis =
    '<line x1="' + L + '" x2="' + (W_ - R) + '" y1="' + (T + ph) + '" y2="' + (T + ph) + '" stroke="var(--line2)"/>' +
    '<text x="' + L + '" y="' + (H - 4) + '">least gain</text>' +
    '<text x="' + (W_ - R) + '" y="' + (H - 4) + '" text-anchor="end">most gain</text>' +
    '<text x="' + (L - 4) + '" y="' + (T + 8) + '" text-anchor="end">' + f0(max / 1.08) + '</text>' +
    '<text x="' + (L - 4) + '" y="' + (T + ph) + '" text-anchor="end">0</text>';
  const legend = '<span><i style="background:var(--daring);opacity:.6"></i>more than expected (' + f0(g.more) + '% chance)</span><span><i style="background:var(--line2)"></i>less than expected (' + f0(g.less) + '%)</span><span><i style="border:2px solid var(--fg);background:none"></i>your gain (' + f2(g.gain) + ' bits)</span>';
  return '<svg viewBox="0 0 ' + W_ + ' ' + H + '" role="img" aria-label="Every outcome of ' + g.word + ', as wide as its chance and as tall as its gain in bits">' + bars + lines + lab + axis + mark + '</svg><div class="legend">' + legend + '</div>';
}

// ---- one level ----
function renderLevel() {
  const g = G[sel];
  const picks = (title, arr, cls, fmt, extra) => '<div><h3 class="' + cls + '" style="margin-bottom:4px">' + title + '</h3>' + arr.map(p => '<div class="pk"><b>' + p[0] + '</b><span class="' + cls + '">' + fmt(p[1]) + (extra ? ' <span class="dim small">' + extra(p) + '</span>' : '') + '</span></div>').join('') + '</div>';
  const side = g.D > 10 ? 'Usually less than expected, with a small chance of much more.'
    : g.D < -10 ? 'Usually more than expected, with a small chance of much less: no gamble, so daring is 0.'
    : 'Less and more than expected are about equally likely, so there is little gamble.';
  $('level').innerHTML =
    '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">' + tiles(g.word) + '<span class="dim">' + N(g.n) + ' words possible</span></div>' +
    '<div class="block"><h3>All outcomes of your guess</h3><p class="small dim">Each column is one possible outcome: as wide as its chance, as tall as the bits it would gain. The area under the columns is the expected gain. Skill and daring depend only on the columns. Luck depends on which column you landed in. The yellow line splits the chance in half: the middle outcome, luck 0.</p>' + plot(g) + '</div>' +

    '<div class="block"><h3 class="skill">Skill</h3>' +
    '<p class="small dim">How many bits the guess is expected to gain, averaged over all possible answers, compared with the best guess. Any answer gives the same skill.</p>' +
    '<div class="sum">' +
      '<span>expected gain, H = Σ chance × bits</span><span>' + f2(g.H) + ' bits</span>' +
      '<span>best guess, H* (' + g.bestWord + ')</span><span>' + f2(g.hstar) + ' bits</span>' +
      '<i class="rule"></i><span class="res skill">skill = ' + f2(g.H) + ' ÷ ' + f2(g.hstar) + ' × 100</span><span class="res skill">' + f1(g.skill) + '</span>' +
    '</div><p class="small dim">H* and D* are the only values not taken from the plot. Both come from scoring every accepted word as a guess.</p></div>' +

    '<div class="block"><h3 class="daring">Daring</h3>' +
    '<p class="small dim">How much the guess gambles on the tail. A daring guess usually gains less than expected and sometimes much more. A gain of exactly H counts for neither. Daring is scored against the most daring guess, as skill is against the best.</p>' +
    '<div class="sum">' +
      '<span>chance of less than expected</span><span>' + f1(g.less) + '%</span>' +
      '<span>chance of more than expected</span><span>' + f1(g.more) + '%</span>' +
      '<span>less − more, at least 0</span><span>' + f1(Math.max(0, g.D)) + '%</span>' +
      '<span>most daring guess, D*' + (g.dareWord ? ' (' + g.dareWord + ')' : '') + '</span><span>' + f1(g.dstar) + '%</span>' +
      '<i class="rule"></i><span class="res daring">daring = ' + f1(Math.max(0, g.D)) + ' ÷ ' + f1(g.dstar) + ' × 100</span><span class="res daring">' + f1(g.daring) + '</span>' +
    '</div><p class="small dim">' + side + '</p></div>' +

    '<div class="block"><h3 class="luck">Luck</h3>' +
    '<p class="small dim">The answer decides this. Your gain is outlined on the plot.</p>' +
    '<div class="sum">' +
      '<span>chance of gaining less than ' + f2(g.gain) + ' bits</span><span>' + f1(g.gotLess) + '%</span>' +
      '<span>chance of gaining more than ' + f2(g.gain) + ' bits</span><span>' + f1(g.gotMore) + '%</span>' +
      '<i class="rule"></i><span class="res luck">luck = less − more</span><span class="res luck">' + sg(g.luck) + '%</span>' +
    '</div></div>' +

    '<div class="block"><div class="cols">' + picks('best skill', g.top, 'skill', f0) + picks('worst skill', g.bottom, 'skill', f0) +
      picks('most daring', g.dare, 'daring', v => g.dstar > 0 ? f0(v / g.dstar * 100) : '0', p => 'skill ' + p[2]) + picks('luckiest', g.lucky, 'luck', pc) + '</div>' +
    '<p class="small dim">Among all accepted words. Yours: skill <b class="skill">' + f0(g.skill) + '</b>, daring <b class="daring">' + f0(g.daring) + '</b>, luck <b class="luck">' + pc(g.luck) + '</b>. Luckiest is for the actual answer, ' + ANSWER + ': guessing it is always the luckiest.' + (g.ties ? ' With two words left every guess that separates them ties.' : '') + '</p></div>';
}

// ---- information gained, in bits: expected gain + luck ----
function bars() {
  const W_ = 420, rowH = 28, L = 64, R = 56, top = 12, cap = log2(243);
  const sx = v => L + v / top * (W_ - L - R), H = G.length * rowH + 30;
  let s = '';
  for (let t = 0; t <= top; t += 2) s += '<line x1="' + sx(t) + '" x2="' + sx(t) + '" y1="0" y2="' + (H - 20) + '" stroke="var(--line)"/><text x="' + sx(t) + '" y="' + (H - 8) + '" text-anchor="middle">' + t + '</text>';
  s += '<line x1="' + sx(cap) + '" x2="' + sx(cap) + '" y1="0" y2="' + (H - 20) + '" stroke="var(--dim)" stroke-dasharray="3 3"/><text x="' + (sx(cap) + 3) + '" y="9">max expected ' + f2(cap) + '</text>';
  G.forEach((g, i) => {
    const y = i * rowH + 14, h = 14, base = Math.min(g.H, g.gain);
    s += '<text x="0" y="' + (y + 11) + '">' + (i + 1) + ' ' + g.word + '</text>';
    s += '<rect x="' + sx(0) + '" y="' + y + '" width="' + Math.max(sx(base) - sx(0), 0.5) + '" height="' + h + '" fill="var(--skill)"/>';
    if (g.bLuck > 0.005) s += '<rect x="' + sx(g.H) + '" y="' + y + '" width="' + (sx(g.gain) - sx(g.H)) + '" height="' + h + '" fill="var(--luck)"/>';
    if (g.bLuck < -0.005) s += '<rect x="' + sx(g.gain) + '" y="' + y + '" width="' + (sx(g.H) - sx(g.gain)) + '" height="' + h + '" fill="none" stroke="var(--luck)" stroke-width="1.5" stroke-dasharray="3 2"/>';
    s += '<text x="' + (sx(Math.max(g.H, g.gain)) + 5) + '" y="' + (y + 11) + '" style="fill:var(--fg)">' + f2(g.gain) + '</text>';
  });
  return '<svg viewBox="0 0 ' + W_ + ' ' + H + '" role="img" aria-label="Expected gain and luck of each guess, in bits">' + s + '</svg>' +
    '<div class="legend"><span><i style="background:var(--skill)"></i>expected gain (skill)</span><span><i style="background:var(--luck)"></i>luck added</span><span><i style="border:1.5px dashed var(--luck);background:none"></i>luck taken away</span></div>';
}
function renderTries() {
  let cum = 0;
  const rows = G.map((g, i) => { cum += g.gain; return '<tr><td>' + (i + 1) + ' ' + g.word + '</td><td class="skill">' + f2(g.H) + '</td><td class="luck">' + sg(g.bLuck, 2) + '</td><td><b>' + f2(g.gain) + '</b></td><td>' + f0(cum / needed * 100) + '%</td></tr>'; }).join('');
  const totH = G.reduce((a, g) => a + g.H, 0), totL = G.reduce((a, g) => a + g.bLuck, 0), totC = G.reduce((a, g) => a + g.gain, 0);
  $('tries').innerHTML =
    '<p>A game ends when the word is found. Finding it among ' + N(G[0].n) + ' words takes log₂ ' + N(G[0].n) + ' = <b>' + f2(needed) + ' bits</b>. Each guess removes some of them.</p>' +
    '<div class="steps">' +
      '<div class="step"><span>1</span><div><b>Expected gain (skill)</b>' +
        '<p class="small dim">What the guess removes on average over all possible answers. Skill scores it against the best guess. It never exceeds log₂ 243 = ' + f2(log2(243)) + ' bits, and a good first guess gets about 5.</p></div></div>' +
      '<div class="step"><span>2</span><div><b>Luck</b>' +
        '<p class="small dim">What the answer added or took away: bits gained minus expected gain. Over all answers it averages 0.</p></div></div>' +
      '<div class="step"><span>3</span><div><b>Bits gained</b>' +
        '<p class="small dim">Expected gain + luck = log₂(words before ÷ words in your pool). The last guess takes everything that is left.</p></div></div>' +
    '</div>' +
    '<div class="wrap"><table><thead><tr><th>guess</th><th class="skill">expected</th><th class="luck">luck</th><th>gained</th><th>done</th></tr></thead><tbody>' + rows +
    '</tbody><tfoot><tr><td>total</td><td class="skill">' + f2(totH) + '</td><td class="luck">' + sg(totL, 2) + '</td><td>' + f2(totC) + '</td><td>100%</td></tr></tfoot></table></div>' +
    bars() +
    '<p class="small dim">Daring is not added. It gauges the gamble: how much a guess relied on landing in the tail. Whether you landed there is luck.</p>';
}

function renderAll() { renderRows(); renderTabs(); renderLevel(); renderTries(); }
renderAll();
</script>
