<style>
/* The app's look: JetBrains Mono, lowercase, hairline borders, flat surfaces, a pink accent on olive-black (dark) or cream (light). Dark values are sampled from the app's screenshots; light ones are close estimates. */
:root {
  --bg: #fefbe8; --fg: #1d1d11; --dim: #6c6b5e; --outline: #7c7a62; --outlinev: #cac8ae;

  --font: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141409; --fg: #e6e3d1; --dim: #9e9c8d; --outline: #949279; --outlinev: #494833;
  --primary: #f6b0ea; --onprimary: #4f1c4c; --secondary: #b4cea5; --yellow: #f0c219; --flame: #c7cb82; --absent: #313125; --bar: #535245; --hl: #26201b;
  --skill: #4c8dff; --luck: #f2c230; --risk: #5cb85c; --bits: #a98bff; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141409; --fg: #e6e3d1; --dim: #9e9c8d; --outline: #949279; --outlinev: #494833;
  --primary: #f6b0ea; --onprimary: #4f1c4c; --secondary: #b4cea5; --yellow: #f0c219; --flame: #c7cb82; --absent: #313125; --bar: #535245; --hl: #26201b;
  --skill: #4c8dff; --luck: #f2c230; --risk: #5cb85c; --bits: #a98bff; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.5; text-transform: lowercase;
  padding-block: 16px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: 104px; }
main { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; padding: 0 8px; }
h1 { font-size: 14px; letter-spacing: 1.5px; font-weight: 400; margin: 0; }
h2 { font-size: 22px; margin: 0; font-weight: 700; text-wrap: balance; }
h3 { font-size: 12px; letter-spacing: 2px; color: var(--dim); margin: 0; font-weight: 400; }
p { margin: 0; }
.dim { color: var(--dim); } .small { font-size: 12px; }
.skill { color: var(--skill); } .luck { color: var(--luck); } .risk { color: var(--risk); } .bits { color: var(--bits); }
.note { border: 1px dashed var(--outline); border-radius: 3px; padding: 8px 10px; color: var(--dim); font-size: 12px; }
.tiles { display: inline-flex; gap: 3px; }
.tile { width: 22px; height: 22px; border-radius: 3px; display: grid; place-items: center; font-weight: 700; font-size: 12px; }
.tile.g { background: var(--secondary); color: #1d1d11; } .tile.y { background: var(--yellow); color: #1d1d11; } .tile.x { background: var(--absent); color: var(--dim); }
.wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th { text-align: right; font-size: 11px; font-weight: 400; letter-spacing: 1px; color: var(--dim); padding: 4px 4px; border-bottom: 1px solid var(--outlinev); }
td { text-align: right; padding: 8px 4px; border-bottom: 1px solid var(--outlinev); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
td .tile { width: 18px; height: 18px; font-size: 10px; } td .tiles { gap: 2px; }
tbody tr.pick { cursor: pointer; }
tbody tr.sel td { background: var(--hl); }
tbody tr.pick:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
.block { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--outlinev); padding-top: 14px; }
.sum { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font-variant-numeric: tabular-nums; }
.sum > span:nth-of-type(even) { text-align: right; }
.sum .res { font-weight: 700; }
.sum .rule { grid-column: 1 / -1; border-top: 1px solid var(--outlinev); margin: 3px 0; }
svg { display: block; width: 100%; height: auto; }
svg text { text-transform: none; fill: var(--dim); font-family: var(--font); font-size: 10px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.cols > div { min-width: 0; }
.pk { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--outlinev); font-variant-numeric: tabular-nums; }
.pk b { font-size: 15px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11px; color: var(--dim); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.sub { font-size: 12px; letter-spacing: 2px; color: var(--dim); }
.math { font-size: 13px; line-height: 1.55; white-space: pre-line; font-variant-numeric: tabular-nums; }
math { text-transform: none; font-size: 1.1em; }
.formula { display: flex; flex-direction: column; gap: 4px; }
.where { font-size: 12px; color: var(--dim); }
.sym { text-transform: none; }
.pills { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { font: inherit; letter-spacing: 1.2px; padding: 6px 16px; border-radius: 999px; border: 1.5px solid currentColor; background: transparent; cursor: pointer; color: var(--fg); }
.pill:hover { background: color-mix(in srgb, currentColor 12%, transparent); }
.hd { display: flex; align-items: center; gap: 8px; }
.dot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--dim); background: transparent; color: var(--dim); font: italic 700 11px/1 Georgia, serif; text-transform: none; cursor: pointer; display: grid; place-items: center; padding: 0; flex: none; }
.pop { position: absolute; z-index: 30; max-width: min(340px, calc(100vw - 32px)); background: var(--bg); color: var(--fg); border: 1px solid var(--outline); border-radius: 3px; padding: 10px 12px; font-size: 13px; line-height: 1.45; text-transform: lowercase; }
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.55); display: flex; justify-content: center; align-items: center; padding: 24px 16px; overscroll-behavior: contain; }
.modal { background: var(--bg); color: var(--fg); border: 1px solid var(--outline); border-radius: 3px; max-width: 480px; width: 100%; max-height: 100%; overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; text-transform: lowercase; }
.modal > * { flex-shrink: 0; }
.modal h2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.close { font: inherit; background: transparent; border: 1px solid var(--outline); color: var(--fg); border-radius: 3px; padding: 4px 10px; cursor: pointer; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bg); padding: 8px max(24px, env(safe-area-inset-left, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)); }
.nav > div { max-width: 480px; margin: 0 auto; display: flex; gap: 12px; }
.btn { flex: 1; font: inherit; letter-spacing: 1.5px; height: 48px; border-radius: 3px; border: 1px solid var(--outline); background: transparent; color: var(--fg); cursor: pointer; }
.btn.fill { background: var(--primary); color: var(--onprimary); border-color: var(--primary); font-weight: 700; }
.btn:disabled { opacity: .4; cursor: default; }
.link { font: inherit; letter-spacing: 1.2px; background: none; border: 0; color: var(--primary); cursor: pointer; padding: 6px 0; text-align: left; }
button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.seg { display: flex; gap: 4px; }
.seg i { flex: 1; height: 4px; border-radius: 2px; background: var(--outlinev); cursor: pointer; }
.seg i.past { background: var(--bar); } .seg i.cur { background: var(--primary); }
.modal > * { flex-shrink: 0; }
table.st { font-size: 12px; } table.st td { padding: 6px 3px; line-height: 1.25; } table.st th { padding: 4px 3px; } table.st td .tile { width: 15px; height: 15px; font-size: 9px; } table.st td .tiles { gap: 1px; }
.sb { border: 0; background: transparent; color: var(--primary); font-size: 16px; line-height: 1; padding: 0; margin: 0; cursor: pointer; display: inline-block; vertical-align: middle; width: 16px; height: 16px; }
.sb:hover { color: var(--fg); }

// The six playstyles: an early game habit and an end game habit. Their order here is the order of the grid.
const STYLES = [
  { id: 'analyst',   name: 'Analyst',   early: 'maximiser',  end: 'prober', text: 'Plays the best splits all game, and spends a guess to split the last words when it must.' },
  { id: 'maverick',  name: 'Maverick',  early: 'maximiser',  end: 'closer', text: 'Plays the best splits early, then goes for the word as soon as one fits.' },
  { id: 'detective', name: 'Detective', early: 'eliminator', end: 'prober', text: 'Clears letters first, then splits the last candidates before committing.' },
  { id: 'sweeper',   name: 'Sweeper',   early: 'eliminator', end: 'closer', text: 'Clears letters first, then goes straight for the word.' },
  { id: 'wildcard',  name: 'Wildcard',  early: 'gambler',    end: 'prober', text: 'Gambles on the first two turns, then settles into proper splits.' },
  { id: 'gambler',   name: 'Gambler',   early: 'gambler',    end: 'closer', text: 'Gambles on the first two turns and goes all in for the word.' },
];
const G = PLAY.detective;

// ---- the maths: everything is information, in bits ----
const log2 = Math.log2;
function score(g) {
  g.word = g.word.toUpperCase();
  if (g.unscored) { g.skill = g.risk = g.luck = null; g.gain = 0; g.H = 0; g.bLuck = 0; g.hstar = 0; return; }
  g.sizes.sort((a, b) => b - a);
  g.landed = g.sizes.indexOf(g.landedSize);
  g.gains = g.sizes.map(s => log2(g.n / s));                                  // bits an outcome gains
  g.H = g.sizes.reduce((a, s, i) => a + s / g.n * g.gains[i], 0);              // expected gain
  if (g.hstar == null) g.hstar = g.H;
  g.skill = Math.min(100, g.H / g.hstar * 100);
  const share = test => g.sizes.reduce((a, s, i) => a + (test(g.gains[i]) ? s : 0), 0) / g.n * 100;
  g.more = share(x => x > g.H + 1e-9);                                         // chance of gaining more than expected
  g.less = share(x => x < g.H - 1e-9);
  g.D = g.less - g.more;
  if (g.dstar == null) g.dstar = Math.max(g.D, 0);
  g.risk = g.dstar > 0 ? Math.min(100, Math.max(0, g.D) / g.dstar * 100) : 0;
  g.gain = g.gains[g.landed];                                                  // what you gained
  g.bLuck = g.gain - g.H;                                                      // luck in bits
  g.gotMore = share(x => x > g.gain + 1e-9);
  g.gotLess = share(x => x < g.gain - 1e-9);
  g.luck = g.gotLess - g.gotMore;                                              // luck score
}
Object.values(PLAY).forEach(game => game.forEach(score));
const needed = log2(G[0].n);

const $ = id => document.getElementById(id);
const f0 = v => Math.round(v).toString();
const f1 = v => v.toFixed(1);

const sg = (v, d = 1) => (Math.abs(v) < Math.pow(10, -d) / 2 ? '' : v < 0 ? '−' : '+') + Math.abs(v).toFixed(d);
const pc = v => (Math.round(v) === 0 ? '0%' : (v > 0 ? '+' : '−') + Math.abs(Math.round(v)) + '%');
const N = v => v.toLocaleString('en-US');
const esc = t => t.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
const info = t => '<button class="dot" type="button" aria-label="Explain" data-tip="' + esc(t) + '">i</button>';
const hd = (title, cls, tip) => '<div class="hd"><h3 class="' + cls + '">' + title + '</h3>' + (tip ? info(tip) : '') + '</div>';
function tiles(guess) {
  const marks = Array(5).fill('x'), left = {};
  [...ANSWER].forEach((c, i) => { if (guess[i] === c) marks[i] = 'g'; else left[c] = (left[c] || 0) + 1; });
  [...guess].forEach((c, i) => { if (marks[i] !== 'g' && left[c]) { marks[i] = 'y'; left[c]--; } });
  return '<span class="tiles" aria-label="' + guess + '">' + [...guess].map((c, i) => '<span class="tile ' + marks[i] + '">' + c + '</span>').join('') + '</span>';
}
// The words skill, luck and risk always show in their own colours. The symbols H, H*, D* and Σ keep their case on a lowercase page.
function colorize(root) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [];
  while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => {
    const p = n.parentElement;
    if (!p || p.closest('.skill,.luck,.risk,.bits,.sym,svg,script,style,code,math,button')) return;
    if (!/\b(skill|luck|risk)\b|H\*?|D\*|\u03a3/i.test(n.nodeValue)) return;
    const span = document.createElement('span');
    span.innerHTML = n.nodeValue.replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/(\bH\*|\bD\*|\bH\b|\u03a3)/g, '<span class="sym">$1</span>')
      .replace(/\b(skill|luck|risk)\b/gi, m => '<span class="' + m.toLowerCase() + '">' + m + '</span>');
    n.replaceWith(...span.childNodes);
  });
}

// ---- the plot of one guess: one column per outcome, as wide as its chance and as tall as the bits it gains ----
function plot(g) {
  const W_ = 420, H = 186, L = 30, R = 8, T = 10, B = 42, pw = W_ - L - R, ph = H - T - B, top = g.gains[g.gains.length - 1] || 1, max = top * 1.08;
  const y = v => T + ph - v / max * ph;
  let x = L, bars = '', mark = '';
  g.sizes.forEach((s, i) => {
    const w = s / g.n * pw, v = g.gains[i];
    const more = v > g.H + 1e-9, less = v < g.H - 1e-9;
    const fill = more ? 'var(--risk)' : (less ? 'var(--outline)' : 'var(--dim)');
    bars += '<rect x="' + x.toFixed(2) + '" y="' + y(v).toFixed(2) + '" width="' + Math.max(w - .4, .3).toFixed(2) + '" height="' + (T + ph - y(v)).toFixed(2) + '" fill="' + fill + '" opacity="' + (more ? .6 : 1) + '"/>';
    if (i === g.landed) {
      const cx = x + w / 2;
      bars += '<rect x="' + x.toFixed(2) + '" y="' + y(v).toFixed(2) + '" width="' + Math.max(w - .4, 1.5).toFixed(2) + '" height="' + Math.max(T + ph - y(v), 1.5).toFixed(2) + '" fill="none" stroke="var(--fg)" stroke-width="2"/>';
      mark = '<path d="M' + (cx - 5) + ' ' + (T + ph + 12) + ' L' + (cx + 5) + ' ' + (T + ph + 12) + ' L' + cx + ' ' + (T + ph + 4) + ' Z" fill="var(--fg)"/><text x="' + Math.min(Math.max(cx, L + 14), W_ - R - 14) + '" y="' + (T + ph + 24) + '" text-anchor="middle" style="fill:var(--fg)">you</text>';
    }
    x += w;
  });
  const yH = y(g.H), yS = y(g.hstar), close = Math.abs(yH - yS) < 22, mid = L + pw / 2;
  const lines =
    '<line x1="' + L + '" x2="' + (W_ - R) + '" y1="' + yH + '" y2="' + yH + '" stroke="var(--skill)" stroke-width="1.5" stroke-dasharray="5 3"/>' +
    '<line x1="' + L + '" x2="' + (W_ - R) + '" y1="' + yS + '" y2="' + yS + '" stroke="var(--skill)" stroke-width="1.5" stroke-dasharray="1.5 2.5"/>' +
    '<line x1="' + mid + '" x2="' + mid + '" y1="' + T + '" y2="' + (T + ph) + '" stroke="var(--luck)" stroke-width="1.5"/>';
  const lab = (close
      ? '<text x="' + (W_ - R) + '" y="' + (Math.min(yH, yS) - 4) + '" text-anchor="end" style="fill:var(--skill)">H ' + f2(g.H) + ' · H* ' + f2(g.hstar) + '</text>'
      : '<text x="' + (W_ - R) + '" y="' + (yH + 11) + '" text-anchor="end" style="fill:var(--skill)">H ' + f2(g.H) + '</text><text x="' + (W_ - R) + '" y="' + (yS - 4) + '" text-anchor="end" style="fill:var(--skill)">H* ' + f2(g.hstar) + '</text>') +
    '<text x="' + (mid - 4) + '" y="' + (T + 8) + '" text-anchor="end" style="fill:var(--luck)">luck 0</text>';
  const axis =
    '<line x1="' + L + '" x2="' + (W_ - R) + '" y1="' + (T + ph) + '" y2="' + (T + ph) + '" stroke="var(--outline)"/>' +
    '<text x="' + L + '" y="' + (H - 4) + '">least gain</text>' +
    '<text x="' + (W_ - R) + '" y="' + (H - 4) + '" text-anchor="end">most gain</text>' +
    '<text x="' + (L - 4) + '" y="' + (T + 8) + '" text-anchor="end">' + f0(top) + '</text>' +
    '<text x="' + (L - 4) + '" y="' + (T + ph) + '" text-anchor="end">0</text>';
  const legend = '<span><i style="background:var(--risk);opacity:.6"></i>more than expected (' + f0(g.more) + '% chance)</span><span><i style="background:var(--outline)"></i>less than expected (' + f0(g.less) + '%)</span><span><i style="border:2px solid var(--fg);background:none"></i>your gain (' + f2(g.gain) + ' bits)</span>';
  return '<svg viewBox="0 0 ' + W_ + ' ' + H + '" role="img" aria-label="Every outcome of ' + g.word + ', as wide as its chance and as tall as its gain in bits">' + bars + lines + lab + axis + mark + '</svg><div class="legend">' + legend + '</div>';
}

// ---- the waterfall: bits stack up guess by guess, racing to the bits needed ----
function waterfall(list, upto) {
  const W_ = 420, rowH = 34, L = 62, R = 14, top = 12, rows = upto + 1;
  const sx = v => L + v / top * (W_ - L - R), H = rows * rowH + 44;
  let s = '', cum = 0;
  for (let t = 0; t <= top; t += 2) s += '<line x1="' + sx(t) + '" x2="' + sx(t) + '" y1="18" y2="' + (H - 20) + '" stroke="var(--outlinev)"/><text x="' + sx(t) + '" y="' + (H - 6) + '" text-anchor="middle">' + t + '</text>';
  list.slice(0, rows).forEach((g, i) => {
    const y = i * rowH + 26, h = 14, st = cum, end = cum + g.gain, exp = st + g.H;
    s += '<text x="0" y="' + (y + 11) + '"' + (i === upto ? ' style="fill:var(--fg);font-weight:700"' : '') + '>' + (i + 1) + ' ' + g.word + '</text>';
    if (i < upto) s += '<line x1="' + sx(end) + '" x2="' + sx(end) + '" y1="' + (y + h) + '" y2="' + (y + rowH) + '" stroke="var(--dim)"/>';
    s += '<rect x="' + sx(st) + '" y="' + y + '" width="' + Math.max(sx(Math.min(exp, end)) - sx(st), 0.5) + '" height="' + h + '" fill="var(--skill)"/>';
    if (g.bLuck > 0.005) s += '<rect x="' + sx(exp) + '" y="' + y + '" width="' + (sx(end) - sx(exp)) + '" height="' + h + '" fill="var(--luck)"/>';
    if (g.bLuck < -0.005) s += '<rect x="' + sx(end) + '" y="' + y + '" width="' + (sx(exp) - sx(end)) + '" height="' + h + '" fill="none" stroke="var(--luck)" stroke-width="1.5" stroke-dasharray="3 2"/>';
    const best = st + g.hstar, yl = y + h + 5;
    s += '<line x1="' + sx(st) + '" x2="' + sx(best) + '" y1="' + yl + '" y2="' + yl + '" stroke="var(--skill)" stroke-width="1.5"/><line x1="' + sx(best) + '" x2="' + sx(best) + '" y1="' + (yl - 3) + '" y2="' + (yl + 3) + '" stroke="var(--skill)" stroke-width="1.5"/>';
    s += '<text x="' + (sx(Math.max(end, exp)) + 5) + '" y="' + (y + 11) + '" style="fill:var(--fg)">' + f2(end) + '</text>';
    cum = end;
  });

}

    '<p class="sub">Example</p><p>Same guess A as under skill, H = 1.75 bits.</p><div class="math">Answer in a group of 1: gain 3 bits\n  P(less) = 50% + 25% = 75%, P(more) = 0%\n  luck = +75%, luck in bits = 3 − 1.75 = +1.25\n\nAnswer in the group of 4: gain 1 bit\n  P(less) = 0%, P(more) = 50%\n  luck = −50%, luck in bits = 1 − 1.75 = −0.75</div><p class="dim small">Luck says nothing about how good the guess was. A poor guess can be lucky and a great guess unlucky.</p>' +
    '<p class="sub">The maths</p>' + MATHS.luck },
  risk: { cls: 'risk', title: 'Risk', html:
    '<p>Risk is how much a guess gambles on a lucky tail. A risky guess usually gains less than expected, and sometimes gains a lot. A safe guess gains about the same whatever the answer. Risk belongs to the guess, not to the result: whether the gamble paid off is luck.</p>' +
    '<p class="sub">Example</p><p>8 words are possible.</p><div class="math">Guess D splits 2 / 2 / 2 / 2\n  every outcome gains 2 bits = H, so raw = 0: no risk\n\nGuess A splits 4 / 2 / 1 / 1, H = 1.75\n  P(less) = 50% (the 4), P(more) = 50%, raw = 0\n\nGuess C splits 5 / 1 / 1 / 1\n  gains 0.68 bits (5 words) or 3 bits (1 word)\n  H = 5/8 × 0.68 + 3/8 × 3 = 1.55\n  P(less) = 62.5%, P(more) = 37.5%, raw = 25%\n  if raw* = 50%, risk = 25 ÷ 50 × 100 = 50</div><p class="dim small">Guess C almost always leaves 5 words. It pays off only when the answer is one of the 3 loners.</p>' +
    '<p class="sub">The maths</p>' + MATHS.risk },
  bits: { cls: 'bits', title: 'Bits', html:
    '<p>A bit is the information in one yes/no answer with even odds. Each bit halves the number of possible words. Finding one word among N takes log₂ N bits, however you play. Each guess supplies some of them.</p>' +
    '<p class="sub">Example</p><div class="math">64 words, a guess leaves 8:  log₂(64 ÷ 8) = 3 bits\n8 words, a guess leaves 1:   log₂(8 ÷ 1)  = 3 bits\ntotal 6 bits = log₂ 64, all the bits needed\n\n3,000 words need log₂ 3,000 = 11.55 bits</div><p class="dim small">Expected gain is what a guess gives on average. The bits it actually gives depend on which group the answer is in.</p>' +
    '<p class="sub">The maths</p>' + MATHS.bits },
};
function lockScroll(on) { document.documentElement.style.overflow = on ? 'hidden' : ''; document.body.style.overflow = on ? 'hidden' : ''; }
function openLayer(inner, label) {
  lockScroll(true);
  $('layer').innerHTML = '<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true" aria-label="' + esc(label) + '">' + inner + '</div></div>';
  $('ov').addEventListener('click', e => { if (e.target === $('ov')) closeLayer(); });
  $('layer').querySelector('.close').addEventListener('click', closeLayer);
  colorize($('layer'));
  $('layer').querySelector('.close').focus();
}
function closeLayer() { $('layer').innerHTML = ''; lockScroll(false); }
$('pills').innerHTML = ['skill', 'luck', 'risk', 'bits'].map(k => '<button class="pill ' + HELP[k].cls + '" type="button" data-k="' + k + '">' + k + '</button>').join('');
$('pills').querySelectorAll('.pill').forEach(b => b.addEventListener('click', () => {
  const h = HELP[b.dataset.k];
  openLayer('<h2><span class="' + h.cls + '">' + h.title + '</span><button class="close" type="button">close</button></h2>' + h.html, h.title);
}));

// ---- playstyles: how a style is read, with the exact calculation on a real game ----
const RULE = {
  gambler: 'risk of 75 or more', maximiser: 'the guess is in the top 10% of all accepted words by expected gain', eliminator: '4 or more letters never tried in this game',
  closer: 'the guess fits every clue, so it can win', prober: 'the guess does not fit, ranks in the top 10% and 3 or more words are left',
};
const TIPS = {
  how: 'A style is two habits. Early game: 64 or more words still possible. End game: 16 or fewer words possible, or 3 or more greens. Each guess in a phase is counted as one behaviour, the first that applies. Early: gambler (risk 75 or more), else maximiser (top 10% by expected gain), else eliminator (4 or more fresh letters). End: closer (the guess fits every clue), else prober (top 10% by expected gain with 3 or more words left). Your habit in a phase is the behaviour with the highest share of that phase\u2019s guesses, if it is 40% or more. The app reads your last 100 classic games and needs at least 10 guesses in each phase.',
  middle: 'Between 16 and 64 words, with fewer than 3 greens, guesses are not counted. The mid game is where the early habit hands over to the end habit.',
  order: 'When two behaviours could both apply to a guess, the first in the list is the one counted, so a risky guess is never also counted as a maximiser.',
};
const pct = v => Math.round(v * 100) + '%';
const rankText = r => 'top ' + (r < 0.1 ? '0.1' : r < 10 ? r.toFixed(1) : Math.round(r)) + '%';
function judgeGame(game) {
  const phase = (ph, labels) => { const gs = game.filter(g => g.phase === ph); const share = Object.fromEntries(labels.map(l => [l, gs.length ? gs.filter(g => g.label === l).length / gs.length : 0]));
    let best = null, bv = 0; labels.forEach(l => { if (share[l] > bv + 1e-9) { bv = share[l]; best = l; } }); return { gs, share, labels, best: bv >= 0.4 ? best : null }; };
  return { early: phase('early', ['gambler', 'maximiser', 'eliminator']), end: phase('end', ['closer', 'prober']) };
}
function sampleHtml(id) {
  const st = STYLES.find(x => x.id === id), game = PLAY[id], last = game.length - 1, wf = waterfall(game, last), j = judgeGame(game);
  const rows = game.map((g, i) => '<tr><td>' + (i + 1) + ' ' + tiles(g.word) + '</td><td>' + N(g.n) + (g.unscored ? '' : '<br><span class="dim">' + g.phase + '</span>') + '</td><td>' + (g.unscored ? '·' : rankText(g.rank).replace('top ', '')) + '</td><td class="risk">' + (g.unscored ? '·' : f0(g.risk)) + '</td><td>' + (g.unscored ? '·' : g.fresh) + '</td><td style="white-space:normal"><b>' + (g.unscored || g.label === 'none' ? '·' : g.label) + '</b>' + (g.unscored ? '' : '<br><span class="dim">' + (g.fits ? 'fits' : 'no fit') + '</span>') + '</td></tr>').join('');
  const line = (ph, name, o) => '<p class="small"><b>' + name + '</b> · ' + o.gs.length + ' guess' + (o.gs.length === 1 ? '' : 'es') + ': ' +
    o.labels.map(l => l + ' ' + o.gs.filter(g => g.label === l).length + '/' + o.gs.length + ' = ' + pct(o.share[l])).join(', ') + '. ' + (o.best ? 'Habit: <b>' + o.best + '</b> (' + pct(o.share[o.best]) + ', at least 40%).' : 'No habit reaches 40%.') + '</p>';
  const mean = k => { const sc = game.filter(g => !g.unscored); return sc.reduce((a, g) => a + g[k], 0) / sc.length; };
  const won = game[last].win;
  return '<div class="hd"><b style="font-size:18px">' + st.name + '</b><button class="dot" type="button" aria-label="Explain" data-tip="' + esc(st.text + ' ' + RULE[st.early] + ' counts as ' + st.early + ' early. ' + RULE[st.end] + ' counts as ' + st.end + ' at the end.') + '">i</button></div>' +
    '<p class="small dim">' + st.early + ' early · ' + st.end + ' at the end</p><p>' + st.text + '</p>' +
    '<div class="sub hd">this game, guess by guess <button class="dot" type="button" aria-label="Explain" data-tip="' + esc(TIPS.how) + '">i</button></div>' +
    '<div class="wrap"><table class="st"><thead><tr><th>guess</th><th>words</th><th>top</th><th class="risk">risk</th><th>new</th><th>counted</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<div class="sub hd">the calculation <button class="dot" type="button" aria-label="Explain" data-tip="' + esc(TIPS.order) + '">i</button></div>' +
    line('early', 'early game', j.early) + line('end', 'end game', j.end) +
    '<p><b>' + (j.early.best || '?') + ' + ' + (j.end.best || '?') + ' = ' + (STYLES.find(x => x.early === j.early.best && x.end === j.end.best)?.name || 'not decided') + '</b></p>' +
    '<p class="small dim">One game decides nothing. The app does this over your last 100 classic games.</p>' +
    '<p class="small">This game: skill <b class="skill">' + f0(mean('skill')) + '</b>, risk <b class="risk">' + f0(mean('risk')) + '</b>, luck <b class="luck">' + sg(mean('luck'), 0) + '%</b>. ' + (won ? 'Solved in ' + game.length + ' guesses.' : 'Not solved.') + ' Bits gained ' + f2(wf.total) + ' of ' + f2(needed) + '.</p>' + wf.svg;
}
const EVIDENCE = [['Analyst', 'maximiser 100%', 'prober 79%'], ['Maverick', 'maximiser 100%', 'closer 100%'], ['Detective', 'eliminator 87%', 'prober 86%'], ['Sweeper', 'eliminator 87%', 'closer 100%'], ['Wildcard', 'gambler 70%', 'prober 58%'], ['Gambler', 'gambler 65%', 'closer 98%']];
const STYLE_EVIDENCE = '<div class="sub hd">does it work <button class="dot" type="button" aria-label="Explain" data-tip="40 simulated games per style on the real word list, answers drawn from the 3,000 commonest words. Each simulated player follows its style\u2019s habit. The table shows the share of its early and end guesses counted as the habit it was built to have. All six are read back as the style they were built as. Not measured on people.">i</button></div>' +
  '<div class="wrap"><table><thead><tr><th>simulated</th><th>early habit</th><th>end habit</th></tr></thead><tbody>' + EVIDENCE.map(r => '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td><td>' + r[2] + '</td></tr>').join('') + '</tbody></table></div>';
$('samples').addEventListener('click', () => {
  const draw = id => {
    openLayer('<h2><span>Playstyles</span><button class="close" type="button">close</button></h2>' +
      '<p class="small dim">One real game for each style: same word list, same answer, ' + ANSWER + '.</p>' +
      '<div class="pills">' + STYLES.map(x => '<button class="pill" type="button" data-s="' + x.id + '"' + (x.id === id ? ' style="background:color-mix(in srgb,currentColor 16%,transparent)"' : '') + '>' + x.name.toLowerCase() + '</button>').join('') + '</div>' + sampleHtml(id) + STYLE_EVIDENCE, 'Playstyles');
    $('layer').querySelectorAll('[data-s]').forEach(b => b.addEventListener('click', () => draw(b.dataset.s)));
  };
  draw('analyst');
});

renderStep();
</script>
