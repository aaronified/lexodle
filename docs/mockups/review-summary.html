<style>

:root {
  --bg: #fefbe8; --fg: #1d1d11; --dim: #6c6b5e; --outline: #7c7a62; --outlinev: #cac8ae;

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141409; --fg: #e6e3d1; --dim: #9e9c8d; --outline: #949279; --outlinev: #494833;
  --primary: #f6b0ea; --onprimary: #4f1c4c; --secondary: #b4cea5; --yellow: #f0c219; --flame: #c7cb82; --absent: #313125; --bar: #535245; --hl: #26201b;

  --bg: #141409; --fg: #e6e3d1; --dim: #9e9c8d; --outline: #949279; --outlinev: #494833;
  --primary: #f6b0ea; --onprimary: #4f1c4c; --secondary: #b4cea5; --yellow: #f0c219; --flame: #c7cb82; --absent: #313125; --bar: #535245; --hl: #26201b;
  --skill: #4c8dff; --luck: #f2c230; --risk: #5cb85c; --bits: #a98bff; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.5; text-transform: lowercase;
  padding-block: 16px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: 104px; }
main { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; padding: 0 8px; }
h1 { font-size: 14px; letter-spacing: 1.5px; font-weight: 400; margin: 0; }
h2 { font-size: 22px; margin: 0; font-weight: 700; text-wrap: balance; }
h3 { font-size: 12px; letter-spacing: 2px; color: var(--dim); margin: 0; font-weight: 400; }
p { margin: 0; }
.dim { color: var(--dim); } .small { font-size: 12px; }
.skill { color: var(--skill); } .luck { color: var(--luck); } .risk { color: var(--risk); } .bits { color: var(--bits); }
.note { border: 1px dashed var(--outline); border-radius: 3px; padding: 8px 10px; color: var(--dim); font-size: 12px; }
.tiles { display: inline-flex; gap: 3px; }
.tile { width: 22px; height: 22px; border-radius: 3px; display: grid; place-items: center; font-weight: 700; font-size: 12px; }
.tile.g { background: var(--secondary); color: #1d1d11; } .tile.y { background: var(--yellow); color: #1d1d11; } .tile.x { background: var(--absent); color: var(--dim); }
.wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th { text-align: right; font-size: 11px; font-weight: 400; letter-spacing: 1px; color: var(--dim); padding: 4px 4px; border-bottom: 1px solid var(--outlinev); }
td { text-align: right; padding: 8px 4px; border-bottom: 1px solid var(--outlinev); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
td .tile { width: 18px; height: 18px; font-size: 10px; } td .tiles { gap: 2px; }
tbody tr.pick { cursor: pointer; }
tbody tr.sel td { background: var(--hl); }
tbody tr.pick:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
.block { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--outlinev); padding-top: 14px; }
.sum { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font-variant-numeric: tabular-nums; }
.sum > span:nth-of-type(even) { text-align: right; }
.sum .res { font-weight: 700; }
.sum .rule { grid-column: 1 / -1; border-top: 1px solid var(--outlinev); margin: 3px 0; }
svg { display: block; width: 100%; height: auto; }
svg text { fill: var(--dim); font-family: var(--font); font-size: 10px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.cols > div { min-width: 0; }
.pk { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--outlinev); font-variant-numeric: tabular-nums; }
.pk b { font-size: 15px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11px; color: var(--dim); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.sub { font-size: 12px; letter-spacing: 2px; color: var(--dim); }
.math { font-size: 13px; line-height: 1.55; white-space: pre-line; font-variant-numeric: tabular-nums; }
math { text-transform: none; font-size: 1.1em; }
.formula { display: flex; flex-direction: column; gap: 4px; }
.where { font-size: 12px; color: var(--dim); }
.sym { text-transform: none; }
.pills { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { font: inherit; letter-spacing: 1.2px; padding: 6px 16px; border-radius: 999px; border: 1.5px solid currentColor; background: transparent; cursor: pointer; color: var(--fg); }
.pill:hover { background: color-mix(in srgb, currentColor 12%, transparent); }
.hd { display: flex; align-items: center; gap: 8px; }
.dot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--dim); background: transparent; color: var(--dim); font: italic 700 11px/1 Georgia, serif; text-transform: none; cursor: pointer; display: grid; place-items: center; padding: 0; flex: none; }
.pop { position: absolute; z-index: 30; max-width: min(340px, calc(100vw - 32px)); background: var(--bg); color: var(--fg); border: 1px solid var(--outline); border-radius: 3px; padding: 10px 12px; font-size: 13px; line-height: 1.45; text-transform: lowercase; }
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.55); display: flex; justify-content: center; align-items: center; padding: 24px 16px; overscroll-behavior: contain; }
.modal { background: var(--bg); color: var(--fg); border: 1px solid var(--outline); border-radius: 3px; max-width: 480px; width: 100%; max-height: 100%; overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; text-transform: lowercase; }
.modal > * { flex-shrink: 0; }
.modal h2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.close { font: inherit; background: transparent; border: 1px solid var(--outline); color: var(--fg); border-radius: 3px; padding: 4px 10px; cursor: pointer; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bg); padding: 8px max(24px, env(safe-area-inset-left, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)); }
.nav > div { max-width: 480px; margin: 0 auto; display: flex; gap: 12px; }
.btn { flex: 1; font: inherit; letter-spacing: 1.5px; height: 48px; border-radius: 3px; border: 1px solid var(--outline); background: transparent; color: var(--fg); cursor: pointer; }
.btn.fill { background: var(--primary); color: var(--onprimary); border-color: var(--primary); font-weight: 700; }
.btn:disabled { opacity: .4; cursor: default; }
.link { font: inherit; letter-spacing: 1.2px; background: none; border: 0; color: var(--primary); cursor: pointer; padding: 6px 0; text-align: left; }
button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.seg { display: flex; gap: 4px; }
.seg i { flex: 1; height: 4px; border-radius: 2px; background: var(--outlinev); cursor: pointer; }
.seg i.past { background: var(--bar); } .seg i.cur { background: var(--primary); }
.modal > * { flex-shrink: 0; }

  { id: 'analyst',  name: 'Analyst',  tier: 'sharp', side: 'careful', text: 'Plays the best split every time, from any word in the list.' },
  { id: 'maverick', name: 'Maverick', tier: 'sharp', side: 'bold',    text: 'Plays near-best splits, and of those the one with the longest tail.' },
  { id: 'steady',   name: 'Steady',   tier: 'solid', side: 'careful', text: 'Plays the best split among the words that still fit the clues.' },

];
const G = PLAY.steady;

// ---- the maths: everything is information, in bits ----
const log2 = Math.log2;
function score(g) {
  g.word = g.word.toUpperCase();
  if (g.unscored) { g.skill = g.risk = g.luck = null; g.gain = 0; g.H = 0; g.bLuck = 0; g.hstar = 0; return; }
  g.sizes.sort((a, b) => b - a);
  g.landed = g.sizes.indexOf(g.landedSize);
  g.gains = g.sizes.map(s => log2(g.n / s));                                  // bits an outcome gains
  g.H = g.sizes.reduce((a, s, i) => a + s / g.n * g.gains[i], 0);              // expected gain
  if (g.hstar == null) g.hstar = g.H;
  g.skill = Math.min(100, g.H / g.hstar * 100);
  const share = test => g.sizes.reduce((a, s, i) => a + (test(g.gains[i]) ? s : 0), 0) / g.n * 100;
  g.more = share(x => x > g.H + 1e-9);                                         // chance of gaining more than expected
  g.less = share(x => x < g.H - 1e-9);
  g.D = g.less - g.more;
  if (g.dstar == null) g.dstar = Math.max(g.D, 0);
  g.risk = g.dstar > 0 ? Math.min(100, Math.max(0, g.D) / g.dstar * 100) : 0;
  g.gain = g.gains[g.landed];                                                  // what you gained
  g.bLuck = g.gain - g.H;                                                      // luck in bits
  g.gotMore = share(x => x > g.gain + 1e-9);
  g.gotLess = share(x => x < g.gain - 1e-9);
  g.luck = g.gotLess - g.gotMore;                                              // luck score
}
Object.values(PLAY).forEach(game => game.forEach(score));
const needed = log2(G[0].n);

// ---- helpers ----
const $ = id => document.getElementById(id);
const f0 = v => Math.round(v).toString();
const f1 = v => v.toFixed(1);
const f2 = v => v.toFixed(2);
const sg = (v, d = 1) => (Math.abs(v) < Math.pow(10, -d) / 2 ? '' : v < 0 ? '−' : '+') + Math.abs(v).toFixed(d);
const pc = v => (Math.round(v) === 0 ? '0%' : (v > 0 ? '+' : '−') + Math.abs(Math.round(v)) + '%');
const N = v => v.toLocaleString('en-US');
const esc = t => t.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
const info = t => '<button class="dot" type="button" aria-label="Explain" data-tip="' + esc(t) + '">i</button>';
const hd = (title, cls, tip) => '<div class="hd"><h3 class="' + cls + '">' + title + '</h3>' + (tip ? info(tip) : '') + '</div>';
function tiles(guess) {
  const marks = Array(5).fill('x'), left = {};
  [...ANSWER].forEach((c, i) => { if (guess[i] === c) marks[i] = 'g'; else left[c] = (left[c] || 0) + 1; });
  [...guess].forEach((c, i) => { if (marks[i] !== 'g' && left[c]) { marks[i] = 'y'; left[c]--; } });
  return '<span class="tiles" aria-label="' + guess + '">' + [...guess].map((c, i) => '<span class="tile ' + marks[i] + '">' + c + '</span>').join('') + '</span>';
}
// The words skill, luck and risk always show in their own colours.
function colorize(root) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [];
  while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => {
    const p = n.parentElement;
    if (!p || p.closest('.skill,.luck,.risk,.bits,svg,script,style,code,math,button')) return;
    if (!/\b(skill|luck|risk)\b/i.test(n.nodeValue)) return;
    const span = document.createElement('span');
    span.innerHTML = n.nodeValue.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/\b(skill|luck|risk)\b/gi, m => '<span class="' + m.toLowerCase() + '">' + m + '</span>');
    n.replaceWith(...span.childNodes);
  });
}

// ---- the plot of one guess: one column per outcome, as wide as its chance and as tall as the bits it gains ----
function plot(g) {
  const W_ = 420, H = 186, L = 30, R = 8, T = 10, B = 42, pw = W_ - L - R, ph = H - T - B, top = g.gains[g.gains.length - 1] || 1, max = top * 1.08;
  const y = v => T + ph - v / max * ph;
  let x = L, bars = '', mark = '';
  g.sizes.forEach((s, i) => {
    const w = s / g.n * pw, v = g.gains[i];
    const more = v > g.H + 1e-9, less = v < g.H - 1e-9;
    const fill = more ? 'var(--risk)' : (less ? 'var(--outline)' : 'var(--dim)');
    bars += '<rect x="' + x.toFixed(2) + '" y="' + y(v).toFixed(2) + '" width="' + Math.max(w - .4, .3).toFixed(2) + '" height="' + (T + ph - y(v)).toFixed(2) + '" fill="' + fill + '" opacity="' + (more ? .6 : 1) + '"/>';
    if (i === g.landed) {
      const cx = x + w / 2;
      bars += '<rect x="' + x.toFixed(2) + '" y="' + y(v).toFixed(2) + '" width="' + Math.max(w - .4, 1.5).toFixed(2) + '" height="' + Math.max(T + ph - y(v), 1.5).toFixed(2) + '" fill="none" stroke="var(--fg)" stroke-width="2"/>';
      mark = '<path d="M' + (cx - 5) + ' ' + (T + ph + 12) + ' L' + (cx + 5) + ' ' + (T + ph + 12) + ' L' + cx + ' ' + (T + ph + 4) + ' Z" fill="var(--fg)"/><text x="' + Math.min(Math.max(cx, L + 14), W_ - R - 14) + '" y="' + (T + ph + 24) + '" text-anchor="middle" style="fill:var(--fg)">you</text>';
    }
    x += w;
  });
  const yH = y(g.H), yS = y(g.hstar), close = Math.abs(yH - yS) < 22, mid = L + pw / 2;
  const lines =
    '<line x1="' + L + '" x2="' + (W_ - R) + '" y1="' + yH + '" y2="' + yH + '" stroke="var(--skill)" stroke-width="1.5" stroke-dasharray="5 3"/>' +
    '<line x1="' + L + '" x2="' + (W_ - R) + '" y1="' + yS + '" y2="' + yS + '" stroke="var(--skill)" stroke-width="1.5" stroke-dasharray="1.5 2.5"/>' +
    '<line x1="' + mid + '" x2="' + mid + '" y1="' + T + '" y2="' + (T + ph) + '" stroke="var(--luck)" stroke-width="1.5"/>';
  const lab = (close
      ? '<text x="' + (W_ - R) + '" y="' + (Math.min(yH, yS) - 4) + '" text-anchor="end" style="fill:var(--skill)">H ' + f2(g.H) + ' · H* ' + f2(g.hstar) + '</text>'
      : '<text x="' + (W_ - R) + '" y="' + (yH + 11) + '" text-anchor="end" style="fill:var(--skill)">H ' + f2(g.H) + '</text><text x="' + (W_ - R) + '" y="' + (yS - 4) + '" text-anchor="end" style="fill:var(--skill)">H* ' + f2(g.hstar) + '</text>') +
    '<text x="' + (mid - 4) + '" y="' + (T + 8) + '" text-anchor="end" style="fill:var(--luck)">luck 0</text>';
  const axis =
    '<line x1="' + L + '" x2="' + (W_ - R) + '" y1="' + (T + ph) + '" y2="' + (T + ph) + '" stroke="var(--outline)"/>' +
    '<text x="' + L + '" y="' + (H - 4) + '">least gain</text>' +
    '<text x="' + (W_ - R) + '" y="' + (H - 4) + '" text-anchor="end">most gain</text>' +
    '<text x="' + (L - 4) + '" y="' + (T + 8) + '" text-anchor="end">' + f0(top) + '</text>' +
    '<text x="' + (L - 4) + '" y="' + (T + ph) + '" text-anchor="end">0</text>';
  const legend = '<span><i style="background:var(--risk);opacity:.6"></i>more than expected (' + f0(g.more) + '% chance)</span><span><i style="background:var(--outline)"></i>less than expected (' + f0(g.less) + '%)</span><span><i style="border:2px solid var(--fg);background:none"></i>your gain (' + f2(g.gain) + ' bits)</span>';
  return '<svg viewBox="0 0 ' + W_ + ' ' + H + '" role="img" aria-label="Every outcome of ' + g.word + ', as wide as its chance and as tall as its gain in bits">' + bars + lines + lab + axis + mark + '</svg><div class="legend">' + legend + '</div>';
}

// ---- the waterfall: bits stack up guess by guess, racing to the bits needed ----
function waterfall(list, upto) {
  const W_ = 420, rowH = 34, L = 62, R = 14, top = 12, rows = upto + 1;
  const sx = v => L + v / top * (W_ - L - R), H = rows * rowH + 44;
  let s = '', cum = 0;
  for (let t = 0; t <= top; t += 2) s += '<line x1="' + sx(t) + '" x2="' + sx(t) + '" y1="18" y2="' + (H - 20) + '" stroke="var(--outlinev)"/><text x="' + sx(t) + '" y="' + (H - 6) + '" text-anchor="middle">' + t + '</text>';
  list.slice(0, rows).forEach((g, i) => {
    const y = i * rowH + 26, h = 14, st = cum, end = cum + g.gain, exp = st + g.H;
    s += '<text x="0" y="' + (y + 11) + '"' + (i === upto ? ' style="fill:var(--fg);font-weight:700"' : '') + '>' + (i + 1) + ' ' + g.word + '</text>';
    if (i < upto) s += '<line x1="' + sx(end) + '" x2="' + sx(end) + '" y1="' + (y + h) + '" y2="' + (y + rowH) + '" stroke="var(--dim)"/>';
    s += '<rect x="' + sx(st) + '" y="' + y + '" width="' + Math.max(sx(Math.min(exp, end)) - sx(st), 0.5) + '" height="' + h + '" fill="var(--skill)"/>';
    if (g.bLuck > 0.005) s += '<rect x="' + sx(exp) + '" y="' + y + '" width="' + (sx(end) - sx(exp)) + '" height="' + h + '" fill="var(--luck)"/>';
    if (g.bLuck < -0.005) s += '<rect x="' + sx(end) + '" y="' + y + '" width="' + (sx(exp) - sx(end)) + '" height="' + h + '" fill="none" stroke="var(--luck)" stroke-width="1.5" stroke-dasharray="3 2"/>';
    const best = st + g.hstar, yl = y + h + 5;
    s += '<line x1="' + sx(st) + '" x2="' + sx(best) + '" y1="' + yl + '" y2="' + yl + '" stroke="var(--skill)" stroke-width="1.5"/><line x1="' + sx(best) + '" x2="' + sx(best) + '" y1="' + (yl - 3) + '" y2="' + (yl + 3) + '" stroke="var(--skill)" stroke-width="1.5"/>';
    s += '<text x="' + (sx(Math.max(end, exp)) + 5) + '" y="' + (y + 11) + '" style="fill:var(--fg)">' + f2(end) + '</text>';
    cum = end;
  });
  s += '<line x1="' + sx(needed) + '" x2="' + sx(needed) + '" y1="16" y2="' + (H - 20) + '" stroke="var(--fg)" stroke-width="1.5"/><text x="' + (sx(needed) - 4) + '" y="11" text-anchor="end" style="fill:var(--fg)">needed ' + f2(needed) + ' bits</text>';
  return { svg: '<svg viewBox="0 0 ' + W_ + ' ' + H + '" role="img" aria-label="Bits gained guess by guess, against the ' + f2(needed) + ' bits needed">' + s + '</svg>' +
    '<div class="legend"><span><i style="background:var(--skill)"></i>expected gain (skill)</span><span><i style="background:var(--luck)"></i>luck added</span><span><i style="border:1.5px dashed var(--luck);background:none"></i>luck taken away</span><span><i style="height:2px;background:var(--skill);vertical-align:3px"></i>best guess, expected</span></div>', total: cum };
}

// ---- the table of guesses ----
function table(list, upto, nav) {
  const head = '<div class="wrap"><table><thead><tr><th>guess</th><th>words</th><th class="skill">skill</th><th class="risk">risk</th><th class="luck">luck</th><th class="bits">bits</th></tr></thead><tbody>';
  const rows = (nav ? list : list.slice(0, upto + 1)).map((g, i) => {
    const seen = i <= upto && !g.unscored, dim = '<span class="dim">·</span>';
    return '<tr' + (nav ? ' class="pick' + (i === upto ? ' sel' : '') + '" tabindex="0" data-i="' + i + '"' : '') + '><td>' + (i + 1) + ' ' + tiles(g.word) + '</td><td>' + (i <= upto ? N(g.n) : dim) + '</td><td class="skill">' + (seen ? f0(g.skill) : dim) + '</td><td class="risk">' + (seen ? f0(g.risk) : dim) + '</td><td class="luck">' + (seen ? pc(g.luck) : dim) + '</td><td class="bits">' + (seen ? f2(g.gain) : dim) + '</td></tr>';
  }).join('');
  return head + rows + '</tbody></table></div>';
}

const TIP = {
  plot: 'Each column is one possible outcome of your guess. Its width is the chance of that outcome. Its height is the bits it would gain. The area under all the columns is the expected gain, H. The yellow line splits the chance in half: the middle outcome, where luck is 0.',
  skill: 'Skill is how many bits the guess is expected to gain, averaged over all possible answers, compared with the best guess. Any answer gives the same skill. H* comes from scoring every accepted word as a guess, so it is not on the plot.',
  risk: 'Risk is how much the guess gambles on the tail. A risky guess usually gains less than expected and sometimes much more. A gain of exactly H counts for neither side. Risk is scored against the riskiest guess, as skill is against the best. D* comes from scoring every accepted word.',
  luck: 'The answer decides luck. Your gain is outlined on the plot. Luck is the chance of gaining less than you did minus the chance of gaining more, from −100% to +100%.',
  picks: 'Scores among all accepted words. The luckiest picks are for the actual answer. Guessing the answer itself is listed first, then the two next luckiest.',
  bits: 'A game ends when the word is found. Finding one among N words takes log₂ N bits, whatever you play. Each guess adds its expected gain (blue, your skill), then luck (yellow adds, dashed takes away). The thin line shows where the best guess was expected to land. The last guess takes everything that is left. Risk is not added: it gauges the gamble, and whether the gamble paid off is luck.',
};

// ---- the step page ----
let step = 0;
function renderStep() {
  const g = G[step], n = G.length;
  $('title').textContent = 'your ' + ORD[step] + ' guess';
  $('sub').textContent = 'the word was ' + ANSWER;
  $('board').innerHTML = table(G, step, true);
  $('board').querySelectorAll('tr.pick').forEach(tr => {
    const jump = () => { step = +tr.dataset.i; renderStep(); window.scrollTo(0, 0); };
    tr.addEventListener('click', jump);
    tr.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); jump(); } });
  });
  const picks = (title, arr, cls, fmt, extra) => '<div><h3 class="' + cls + '" style="margin-bottom:4px">' + title + '</h3>' + arr.map(p => '<div class="pk"><b>' + p[0] + '</b><span class="' + cls + '">' + fmt(p[1]) + (extra ? ' <span class="dim small">' + extra(p) + '</span>' : '') + '</span></div>').join('') + '</div>';
  const side = g.D > 10 ? 'Usually less than expected, with a small chance of much more.'
    : g.D < -10 ? 'Usually more than expected, with a small chance of much less: no gamble, so risk is 0.'
    : 'Less and more than expected are about equally likely, so there is little gamble.';
  const wf = waterfall(G, step);
  const done = wf.total / needed * 100;
  if (g.unscored) {
    $('step').innerHTML = '<p>One word was left, so there was nothing to choose and nothing to score. Playing it ended the game.</p><div class="block">' + hd('Bits gained', 'bits', TIP.bits) + '<div class="sum"><span>so far, of ' + f2(needed) + ' needed</span><span><b>' + f2(wf.total) + '</b> (' + f0(done) + '%)</span></div>' + wf.svg + '</div>';
    colorize($('board')); colorize($('step'));
    $('back').disabled = step === 0;
    $('next').textContent = step === n - 1 ? 'done' : 'next';
    return;
  }
  $('step').innerHTML =
    '<div class="block" style="border-top:0;padding-top:0">' + hd('All outcomes of your guess', '', TIP.plot) + plot(g) + '</div>' +

    '<div class="block">' + hd('Skill', 'skill', TIP.skill) + '<div class="sum">' +
      '<span>expected gain, H = Σ chance × bits</span><span>' + f2(g.H) + ' bits</span>' +
      '<span>best guess, H* (' + g.bestWord + ')</span><span>' + f2(g.hstar) + ' bits</span>' +
      '<i class="rule"></i><span class="res skill">skill = ' + f2(g.H) + ' ÷ ' + f2(g.hstar) + ' × 100</span><span class="res skill">' + f1(g.skill) + '</span></div></div>' +

    '<div class="block">' + hd('Risk', 'risk', TIP.risk) + '<div class="sum">' +
      '<span>chance of less than expected</span><span>' + f1(g.less) + '%</span>' +
      '<span>chance of more than expected</span><span>' + f1(g.more) + '%</span>' +
      '<span>less − more, at least 0</span><span>' + f1(Math.max(0, g.D)) + '%</span>' +
      '<span>riskiest guess, D*' + (g.riskWord ? ' (' + g.riskWord + ')' : '') + '</span><span>' + f1(g.dstar) + '%</span>' +
      '<i class="rule"></i><span class="res risk">risk = ' + f1(Math.max(0, g.D)) + ' ÷ ' + f1(g.dstar) + ' × 100</span><span class="res risk">' + f1(g.risk) + '</span></div>' +
      '<p class="small dim">' + side + '</p></div>' +

    '<div class="block">' + hd('Luck', 'luck', TIP.luck) + '<div class="sum">' +
      '<span>chance of gaining less than ' + f2(g.gain) + ' bits</span><span>' + f1(g.gotLess) + '%</span>' +
      '<span>chance of gaining more than ' + f2(g.gain) + ' bits</span><span>' + f1(g.gotMore) + '%</span>' +
      '<i class="rule"></i><span class="res luck">luck = less − more</span><span class="res luck">' + sg(g.luck) + '%</span></div></div>' +

    '<div class="block">' + hd('Bits gained', 'bits', TIP.bits) +
      '<div class="sum"><span>this guess: skill + luck</span><span>' + f2(g.H) + ' ' + sg(g.bLuck, 2) + ' = <b>' + f2(g.gain) + ' bits</b></span>' +
      '<span>so far, of ' + f2(needed) + ' needed</span><span><b>' + f2(wf.total) + '</b> (' + f0(done) + '%)</span></div>' + wf.svg + '</div>' +

    '<div class="block">' + hd('Picks', '', TIP.picks) + '<div class="cols">' + picks('best skill', g.top, 'skill', f0) + picks('worst skill', g.bottom, 'skill', f0) +
      picks('highest risk', g.risky, 'risk', v => g.dstar > 0 ? f0(v / g.dstar * 100) : '0', p => 'skill ' + p[2]) + picks('luckiest', g.lucky, 'luck', pc) + '</div>' +
      '<p class="small dim">Yours: skill <b class="skill">' + f0(g.skill) + '</b>, risk <b class="risk">' + f0(g.risk) + '</b>, luck <b class="luck">' + pc(g.luck) + '</b>.' + '</p></div>';
  colorize($('board')); colorize($('step'));
  $('back').disabled = step === 0;
  $('next').textContent = step === n - 1 ? 'done' : 'next';
}
function go(d) { const t = step + d; if (t < 0 || t > G.length - 1) return; step = t; renderStep(); window.scrollTo(0, 0); }
$('back').addEventListener('click', () => go(-1));
$('next').addEventListener('click', () => go(1));
document.addEventListener('keydown', e => {
  if ($('layer').firstChild) { if (e.key === 'Escape') closeLayer(); return; }
  if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1); else if (e.key === 'Escape') closePop();
});

// ---- info dots: a small popover ----
let pop = null;
function closePop() { if (pop) { pop.remove(); pop = null; } }
document.addEventListener('click', e => {
  const d = e.target.closest('.dot');
  if (!d) { if (!e.target.closest('.pop')) closePop(); return; }
  const same = pop && pop.dataset.for === d.dataset.tip;
  closePop();
  if (same) return;
  pop = document.createElement('div');
  pop.className = 'pop'; pop.dataset.for = d.dataset.tip; pop.setAttribute('role', 'note');
  pop.textContent = d.dataset.tip;
  document.body.appendChild(pop);
  colorize(pop);
  const r = d.getBoundingClientRect(), pw = pop.offsetWidth;
  pop.style.left = Math.max(16, Math.min(r.left + scrollX - 8, scrollX + document.documentElement.clientWidth - pw - 16)) + 'px';
  pop.style.top = (r.bottom + scrollY + 6) + 'px';
});

// ---- the pills: what each word means, with the maths and a worked example ----
const tbl = rows => '<div class="wrap"><table><thead><tr><th>group of words</th><th>chance</th><th>bits gained</th></tr></thead><tbody>' + rows.map(r => '<tr>' + r.map((c, i) => '<td' + (i === 0 ? '' : '') + '>' + c + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
const SPLIT_A = tbl([['4 words', '4 ÷ 8 = 50%', 'log₂(8 ÷ 4) = 1'], ['2 words', '2 ÷ 8 = 25%', 'log₂(8 ÷ 2) = 2'], ['1 word', '1 ÷ 8 = 12.5%', 'log₂(8 ÷ 1) = 3'], ['1 word', '1 ÷ 8 = 12.5%', 'log₂(8 ÷ 1) = 3']]);
// MathML helpers: real notation for the full maths at the bottom of each popup
const mi = x => '<mi>' + x + '</mi>', mw = x => '<mi mathvariant="normal"' + (['skill', 'luck', 'risk'].includes(x) ? ' class="' + x + '"' : '') + '>' + x + '</mi>', mn = x => '<mn>' + x + '</mn>', mo = x => '<mo>' + x + '</mo>';
const row = (...x) => '<mrow>' + x.join('') + '</mrow>', frac = (a, b) => '<mfrac>' + a + b + '</mfrac>';
const sub = (a, b) => '<msub>' + a + b + '</msub>', sup = (a, b) => '<msup>' + a + b + '</msup>';
const paren = x => row(mo('('), x, mo(')')), brack = x => row(mo('['), x, mo(']'));
const mm = x => '<math display="block">' + x + '</math>', im = x => '<math>' + x + '</math>';
const mlog = x => sub(mw('log'), mn(2)) + mo('⁡') + paren(x);
const Pr = x => mi('P') + paren(x);
const Hs = sup(mi('H'), mo('*'));
const MATHS = {
  skill: '<div class="formula">' +
    mm(row(mw('skill'), mo('='), frac(mi('H'), Hs), mo('×'), mn(100))) +
    mm(row(mi('H'), mo('='), '<munder>' + mo('∑') + mi('o') + '</munder>', sub(mi('q'), mi('o')), mo('·'), mlog(frac(mi('N'), sub(mi('s'), mi('o')))), mo(','), sub(mi('q'), mi('o')), mo('='), frac(sub(mi('s'), mi('o')), mi('N')))) + '</div>' +
    '<p class="where">' + im(mi('o')) + ' an outcome (a pattern of tiles) · ' + im(sub(mi('s'), mi('o'))) + ' words that give it · ' + im(mi('N')) + ' words still possible · ' + im(Hs) + ' the largest ' + im(mi('H')) + ' among all accepted guesses</p>',
  luck: '<div class="formula">' +
    mm(row(mw('luck'), mo('='), mn(100), mo('·'), brack(row(Pr(row(mi('G'), mo('&lt;'), mi('g'))), mo('−'), Pr(row(mi('G'), mo('&gt;'), mi('g'))))))) +
    mm(row(mo('−'), mn(100), mo('≤'), mw('luck'), mo('≤'), mn(100))) +
    mm(row(mi('G'), mo('='), mlog(frac(mi('N'), sub(mi('s'), mi('O')))))) +
    mm(row(mi('ε'), mo('='), mi('g'), mo('−'), mi('H'), mo(','), mi('E'), brack(mi('ε')), mo('='), mn(0))) + '</div>' +
    '<p class="where">' + im(mi('G')) + ' the gain of the outcome ' + im(mi('O')) + ' the unknown answer will give · ' + im(mi('g')) + ' the gain you got · ' + im(mi('ε')) + ' luck in bits, which averages 0 over all answers</p>',
  risk: '<div class="formula">' +
    mm(row(mi('r'), mo('='), mw('max'), row(mo('{'), mn(0), mo(','), Pr(row(mi('G'), mo('&lt;'), mi('H'))), mo('−'), Pr(row(mi('G'), mo('&gt;'), mi('H'))), mo('}')))) +
    mm(row(mw('risk'), mo('='), mn(100), mo('·'), frac(mi('r'), sup(mi('r'), mo('*'))))) + '</div>' +
    '<p class="where">' + im(mi('G')) + ' the gain of the outcome the unknown answer will give · ' + im(mi('H')) + ' = ' + im(mi('E') + brack(mi('G'))) + ' the expected gain · ' + im(sup(mi('r'), mo('*'))) + ' the largest ' + im(mi('r')) + ' among all accepted guesses</p>',
  bits: '<div class="formula">' +
    mm(row(sub(mi('g'), mi('t')), mo('='), mlog(frac(sub(mi('N'), row(mi('t'), mo('−'), mn(1))), sub(mi('N'), mi('t')))))) +
    mm(row('<munder>' + mo('∑') + mi('t') + '</munder>', sub(mi('g'), mi('t')), mo('='), mlog(sub(mi('N'), mn(0))))) +
    mm(row(mi('H'), mo('≤'), mlog(sup(mn(3), mn(5))), mo('='), mn('7.92'))) + '</div>' +
    '<p class="where">' + im(sub(mi('N'), mi('t'))) + ' words still possible after guess ' + im(mi('t')) + ' · ' + im(sub(mi('g'), mi('t'))) + ' bits gained by guess ' + im(mi('t')) + ' · the last guess takes everything that is left</p>',
};
const HELP = {
  skill: { cls: 'skill', title: 'Skill', html:
    '<p>Skill is how much a guess is expected to teach you, judged before you know the answer. The answer does not change it. 100 means as informative as the best guess available. 0 means the guess tells you nothing.</p>' +
    '<p class="sub">Example</p><p>8 words are possible. The best guess could split them into 8 groups of 1, so H* = log₂ 8 = 3 bits. Guess A splits them 4, 2, 1 and 1:</p>' + SPLIT_A +
    '<div class="math">H = 0.5×1 + 0.25×2 + 0.125×3 + 0.125×3 = 1.75 bits\nskill = 1.75 ÷ 3 × 100 = 58</div><p class="dim small">Think of yes/no questions. A question that splits the options evenly is worth more than one that leaves most of them standing.</p>' +
    '<p class="sub">The maths</p>' + MATHS.skill },
  luck: { cls: 'luck', title: 'Luck', html:
    '<p>Luck is which outcome you actually got. After a guess, the answer sits in one group. Some groups are small and teach you a lot. Some are large and teach you little. Luck compares your group with every group the guess could have given. +100% is the best outcome, −100% the worst, 0% the middle.</p>' +
    '<p class="sub">Example</p><p>Same guess A as under skill, H = 1.75 bits.</p><div class="math">Answer in a group of 1: gain 3 bits\n  P(less) = 50% + 25% = 75%, P(more) = 0%\n  luck = +75%, luck in bits = 3 − 1.75 = +1.25\n\nAnswer in the group of 4: gain 1 bit\n  P(less) = 0%, P(more) = 50%\n  luck = −50%, luck in bits = 1 − 1.75 = −0.75</div><p class="dim small">Luck says nothing about how good the guess was. A poor guess can be lucky and a great guess unlucky.</p>' +
    '<p class="sub">The maths</p>' + MATHS.luck },
  risk: { cls: 'risk', title: 'Risk', html:
    '<p>Risk is how much a guess gambles on a lucky tail. A risky guess usually gains less than expected, and sometimes gains a lot. A safe guess gains about the same whatever the answer. Risk belongs to the guess, not to the result: whether the gamble paid off is luck.</p>' +
    '<p class="sub">Example</p><p>8 words are possible.</p><div class="math">Guess D splits 2 / 2 / 2 / 2\n  every outcome gains 2 bits = H, so raw = 0: no risk\n\nGuess A splits 4 / 2 / 1 / 1, H = 1.75\n  P(less) = 50% (the 4), P(more) = 50%, raw = 0\n\nGuess C splits 5 / 1 / 1 / 1\n  gains 0.68 bits (5 words) or 3 bits (1 word)\n  H = 5/8 × 0.68 + 3/8 × 3 = 1.55\n  P(less) = 62.5%, P(more) = 37.5%, raw = 25%\n  if raw* = 50%, risk = 25 ÷ 50 × 100 = 50</div><p class="dim small">Guess C almost always leaves 5 words. It pays off only when the answer is one of the 3 loners.</p>' +
    '<p class="sub">The maths</p>' + MATHS.risk },
  bits: { cls: 'bits', title: 'Bits', html:
    '<p>A bit is the information in one yes/no answer with even odds. Each bit halves the number of possible words. Finding one word among N takes log₂ N bits, however you play. Each guess supplies some of them.</p>' +
    '<p class="sub">Example</p><div class="math">64 words, a guess leaves 8:  log₂(64 ÷ 8) = 3 bits\n8 words, a guess leaves 1:   log₂(8 ÷ 1)  = 3 bits\ntotal 6 bits = log₂ 64, all the bits needed\n\n3,000 words need log₂ 3,000 = 11.55 bits</div><p class="dim small">Expected gain is what a guess gives on average. The bits it actually gives depend on which group the answer is in.</p>' +
    '<p class="sub">The maths</p>' + MATHS.bits },
};
function lockScroll(on) { document.documentElement.style.overflow = on ? 'hidden' : ''; document.body.style.overflow = on ? 'hidden' : ''; }
function openLayer(inner, label) {
  lockScroll(true);
  $('layer').innerHTML = '<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true" aria-label="' + esc(label) + '">' + inner + '</div></div>';
  $('ov').addEventListener('click', e => { if (e.target === $('ov')) closeLayer(); });
  $('layer').querySelector('.close').addEventListener('click', closeLayer);
  colorize($('layer'));
  $('layer').querySelector('.close').focus();
}
function closeLayer() { $('layer').innerHTML = ''; lockScroll(false); }
$('pills').innerHTML = ['skill', 'luck', 'risk', 'bits'].map(k => '<button class="pill ' + HELP[k].cls + '" type="button" data-k="' + k + '">' + k + '</button>').join('');
$('pills').querySelectorAll('.pill').forEach(b => b.addEventListener('click', () => {
  const h = HELP[b.dataset.k];
  openLayer('<h2><span class="' + h.cls + '">' + h.title + '</span><button class="close" type="button">close</button></h2>' + h.html, h.title);
}));

// ---- sample games: one for each playstyle ----
function sampleHtml(id) {
  const st = STYLES.find(x => x.id === id), game = PLAY[id], last = game.length - 1, wf = waterfall(game, last);
  const scored = game.filter(g => !g.unscored);
  const mean = k => scored.reduce((a, g) => a + g[k], 0) / scored.length;
  const won = game[last].win;
  const result = (won ? 'Solved in ' + game.length + ' guesses.' : 'Not solved after ' + game.length + ' guesses.') + ' Bits gained ' + f2(wf.total) + ' of ' + f2(needed) + '.';
  return '<p><b>' + st.name + '</b>: ' + st.tier + ' and ' + st.side + '. ' + st.text + '</p>' + table(game, last) +
    '<p class="small">This game: skill <b class="skill">' + f0(mean('skill')) + '</b>, risk <b class="risk">' + f0(mean('risk')) + '</b>, luck <b class="luck">' + sg(mean('luck'), 0) + '%</b>. ' + result + '</p>' + wf.svg;
}
const STYLE_RULES = '<p class="sub">How a style is read</p><p>Skill and risk are averaged over a player\u2019s guesses that had a choice. The average skill gives the tier: sharp from 95, loose below 70, solid between. Risk then splits each tier, and the split differs by tier because the two move together: 18 for sharp, 23 for solid, 40 for loose. Above the split is bold, below it careful.</p>' +
  '<div class="wrap"><table><thead><tr><th>style</th><th class="skill">skill</th><th class="risk">risk</th><th>tries</th></tr></thead><tbody>' +
  [['Analyst', 100, 12, 3.6], ['Maverick', 97, 25, 3.7], ['Steady', 93, 20, 3.6], ['Gambler', 78, 26, 4.2], ['Wanderer', 54, 29, 5.5], ['Wildcard', 65, 55, 4.8]].map(r => '<tr><td>' + r[0] + '</td><td class="skill">' + r[1] + '</td><td class="risk">' + r[2] + '</td><td>' + r[3].toFixed(1) + '</td></tr>').join('') +
  '</tbody></table></div><p class="small dim">Means over 150 simulated games per style, answers drawn from the 3,000 commonest words. Not measured on people.</p>';
$('samples').addEventListener('click', () => {
  const draw = id => {
    openLayer('<h2><span>Playstyles</span><button class="close" type="button">close</button></h2>' +
      '<p class="small dim">One simulated game for each style: same word list, same answer, ' + ANSWER + '.</p>' +
      '<div class="pills">' + STYLES.map(x => '<button class="pill" type="button" data-s="' + x.id + '"' + (x.id === id ? ' style="background:color-mix(in srgb,currentColor 16%,transparent)"' : '') + '>' + x.name.toLowerCase() + '</button>').join('') + '</div>' + sampleHtml(id) + STYLE_RULES, 'Playstyles');
    $('layer').querySelectorAll('[data-s]').forEach(b => b.addEventListener('click', () => draw(b.dataset.s)));
  };
  draw('analyst');
});

renderStep();
</script>
